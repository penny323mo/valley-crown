name: Capture genuine v130 Iron Crossroads briefing and delivery
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-v130-iron-crossroads.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Bind official engine, exact artifact bytes and reviewed capture tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'e28acb1b96ff04522e59a5789acf6ed4da1d356cba95a9d4d1cd6727b32382b6  ci/capture-v130-iron-crossroads.gd' | sha256sum --strict -c
          echo '980e5f0186966c2e57b896f8abc72c73014d500c9e4b0e3a016fab94807eda85  ci/capture-v130-iron-crossroads-guard.py' | sha256sum --strict -c
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/v130-engine.zip
          unzip -q /tmp/v130-engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --strict -c
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path[:0]=['scripts']
          from web_release_archive import GitHub,verified_members
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          row,workflow_head,source,tree=({'artifact_id': 14541615113, 'run_id': 44541943816, 'build': 'vc-311f3c608ddc', 'metadata_sha256': 'b4b1fa8f134e279f3392f93d8bc075bac1e5633fda2085418617001f39550081', 'zip_sha256': '9a64956b813db17c5d0e5d9bb788b974ac207e389fbba77b30b5fc87a5dc0d1f'}, '62cf23ef252926cb1a736533511fbc508c3d9ff9', '757ee66b6656af9fdaf1acea7997fee649fd3da8', '5af6623df79d5ded57f982b1244e1592db63df1f')
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']==workflow_head
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          files=verified_members(g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True),row)
          m=json.loads(files['candidate-metadata.json'])
          assert m['source_commit']==source and m['game_tree']==tree
          pck=files['artifacts/clean-a/index.pck']
          assert pck==files['artifacts/clean-b/index.pck']
          path=pathlib.Path('/tmp/v130-capture');path.mkdir()
          (path/'index.pck').write_bytes(pck)
          (path/'capture.gd').write_bytes(pathlib.Path('ci/capture-v130-iron-crossroads.gd').read_bytes())
          (path/'input.json').write_text(json.dumps({'source_commit':source,'game_tree':tree,'build':row['build'],'pck_sha256':hashlib.sha256(pck).hexdigest()}))
          PY
      - name: Run bounded actual map introduction and delivery capture
        run: python3 -B ci/capture-v130-iron-crossroads-guard.py /tmp/v130-capture vc-311f3c608ddc
      - name: Verify authentic briefing and active match PNGs
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/v130-capture')
          d=json.loads((p/'images/report.json').read_text())
          run=json.loads((p/'native-render-receipt.json').read_text())
          info=json.loads((p/'input.json').read_text())
          assert d['complete'] and d['failed']==0 and len(d['checks'])==17 and all(x['passed'] for x in d['checks'])
          assert d['build']=='vc-311f3c608ddc'==info['build']
          assert run['returncode']==0 and run['process_group_gone'] and run['stop_reason'] is None
          assert run['inputs']['index.pck']==info['pck_sha256'] and run['after']['oom']==run['baseline']['oom']
          views={x['name']:x for x in d['views']}
          assert set(views)=={'map-overview','iron-delivered'} and all(x['layout']=='iron_crossroads' for x in views.values())
          assert not views['map-overview']['game_launched']
          assert views['iron-delivered']['tick']==1402 and views['iron-delivered']['bank']['iron']==10000
          assert d['deposits']==[{'milli':10000,'target':views['iron-delivered']['dropoff'],'tick':1402}]
          for n,row in views.items():
              data=(p/'images'/f'{n}.png').read_bytes()
              assert data.startswith(bytes.fromhex('89504e470d0a1a0a')) and hashlib.sha256(data).hexdigest()==row['sha256']
              assert data[12:16]==b'IHDR' and int.from_bytes(data[16:20],'big')==390 and int.from_bytes(data[20:24],'big')==844
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v130-iron-crossroads-real-native
          path: |
            /tmp/v130-capture/input.json
            /tmp/v130-capture/images/*.png
            /tmp/v130-capture/images/report.json
            /tmp/v130-capture/native-render-*.json
            /tmp/v130-capture/native-render-*.txt
          retention-days: 30
          if-no-files-found: error
