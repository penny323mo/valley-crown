name: Capture Valley Crown Town Center research bookmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/capture-vc-town-research-bookmarks.yml]
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: eb6674eff49794cce98a27cef221e2620c0c6434
          path: reviewed-source
          persist-credentials: false
      - name: Verify exact candidate and install known display dependencies
        run: |
          set -euo pipefail
          test "$(git -C reviewed-source rev-parse HEAD)" = eb6674eff49794cce98a27cef221e2620c0c6434
          test "$(git -C reviewed-source rev-parse 'HEAD^{tree}')" = 77726f9f5e34835780ac5945be8d0e18ad0537ad
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o "$RUNNER_TEMP/vc-engine.zip"
          unzip -q "$RUNNER_TEMP/vc-engine.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64"
      - name: Capture actual same-camera training and research views
        run: |
          bash ci/mobile-town-research/run-bookmarks-capture.sh "$GITHUB_WORKSPACE/reviewed-source"             "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64" ci/mobile-town-research/pins.json             "$RUNNER_TEMP/vc-town-research-bookmarks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vc-ab4b930fe35a-native-town-research-bookmarks
          path: ${{ runner.temp }}/vc-town-research-bookmarks/
          retention-days: 30
          if-no-files-found: ignore
