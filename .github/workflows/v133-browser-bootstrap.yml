name: Verify an isolated audit script starts in stock Web export
on:
  push:
    branches: [main]
    paths: [.github/workflows/v133-browser-bootstrap.yml]
permissions:
  contents: read
  actions: read
jobs:
  browser:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact real product archive and isolate browser files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '643e43fa238143419ed78816e5a62ddb55b07654293986eee93bc5354fbd2223  ci/v133-campaign-browser-bootstrap.py' | sha256sum --strict -c
          echo 'efb8adcdc178f1ed70f7914ee29e0e4b2e457560ac176c2efa23bd23d304f463  ci/v133-smoke-campaign-bootstrap.gd' | sha256sum --strict -c
          echo 'a6f3e4f58154fffac011893d174cb061198c1f54e5d55cc423a5ec06ae59af62  ci/v133-smoke-campaign-bootstrap.html' | sha256sum --strict -c
          google-chrome --version
          python3 -B - <<'PY'
          import json,os,pathlib,re,sys
          sys.path.insert(0,'scripts')
          from web_release_archive import GitHub,verified_members
          row={'artifact_id': 14552049410, 'run_id': 44563428226, 'build': 'vc-e559b7eec2ed', 'metadata_sha256': '7536a32378d3ebda48ce6bfc2a42f91b318e6456c3c09808d5f3965c9a96f6b2', 'zip_sha256': '71b8c733242f8f6a1a414f23126496d67632f0257aa1ae42fc8e329ce389f09c'}
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']=='26682d530333c214cc89a53093473ce759ed7a77'
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          data=g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True)
          members=verified_members(data,row)
          identity=json.loads(members['candidate-metadata.json'])
          assert identity['source_commit']=='ffb87bca95c1581332a5b4068a206fb793221592' and identity['game_tree']=='9fe13e38fee4afa1e9991864da561c1041489eeb'
          dest=pathlib.Path('/tmp/v133-browser-proof');dest.mkdir()
          for path,data in members.items():
              if path.startswith('artifacts/clean-a/'):
                  name=path.split('/')[-1]
                  assert name.startswith('index.')
                  (dest/name).write_bytes(data)
          launcher=re.search(r'const GODOT_CONFIG = (\{[^\n]*\});',(dest/'index.html').read_text())
          assert launcher and json.loads(launcher.group(1))['executable']=='index'
          template=pathlib.Path('ci/v133-smoke-campaign-bootstrap.html').read_text()
          assert template.count('GODOT_CONFIG_LITERAL')==1
          (dest/'earned.html').write_text(template.replace('GODOT_CONFIG_LITERAL',launcher.group(1)))
          (dest/'earned-audit.gd').write_bytes(pathlib.Path('ci/v133-smoke-campaign-bootstrap.gd').read_bytes())
          (dest/'probe.html').write_text('<!doctype html><title>local disposable browser proof</title>')
          (dest/'input.json').write_text(json.dumps(row))
          PY
      - name: Run real Web export with ordinary touch and external audit bootstrap
        run: python3 -B ci/v133-campaign-browser-bootstrap.py /tmp/v133-browser-proof bootstrap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v133-browser-bootstrap-proof
          path: |
            /tmp/v133-browser-proof/input.json
            /tmp/v133-browser-proof/browser-proof.json
            /tmp/v133-browser-proof/chromedriver.log
            /tmp/v133-browser-proof/browser-console.json
            /tmp/v133-browser-proof/browser-restored-campaign.png
          retention-days: 15
          if-no-files-found: error
