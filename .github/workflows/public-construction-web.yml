# Reviewed scoped construction contracts and exact Web export on a fresh hosted VM.
name: Collect bounded menu import descriptors
on:
  push:
    branches: [ci/mature-menu-import-metadata-vc-893b58f24e69]
permissions:
  contents: read
concurrency:
  group: consolidated-web-vc-893b58f24e69
  cancel-in-progress: false
jobs:
  export:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CONSTRUCTION_SOURCE_COMMIT: 8ec8624f68bfea6385dba44d8e6fbe8dc279adcd
      CONSTRUCTION_GAME_TREE: 09f6b2bdee3fcf1cb2ca5443c9f1a98c12e3b265
      CONSTRUCTION_BUILD: vc-893b58f24e69
      CONSTRUCTION_EXECUTION_APPROVED: 'true'
    steps:
      - name: Reject pending or unapproved source pins
        run: |
          set -euo pipefail
          test "$CONSTRUCTION_EXECUTION_APPROVED" = true
          test "$GITHUB_REPOSITORY" = penny323mo/valley-crown
          test "$GITHUB_REF" = refs/heads/ci/mature-menu-import-metadata-vc-893b58f24e69
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$CONSTRUCTION_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONSTRUCTION_GAME_TREE" =~ ^[0-9a-f]{40}$ ]]
      - name: Select isolated runner workspace
        run: echo "RTS_WORK=$RUNNER_TEMP/public-web-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact tested public game tree
        run: python3 -B ci/prepare_web_release.py prepare --work "$RTS_WORK"
      - name: Inert construction adapter preflight
        run: python3 -B -m unittest discover -s ci -p test_contracts.py -v
      - name: Prepare pinned official engine and Web template without launch
        run: |
          set -euo pipefail
          python3 -B ci/prepare_web_release.py engine --work "$RTS_WORK"
          python3 -B ci/prepare_web_templates.py --work "$RTS_WORK"
      - name: Fresh bounded import
        run: |
          set -euo pipefail
          source "$RTS_WORK/pins.env"
          python3 -B ci/guarded_manifest_ci.py import --project "$RTS_WORK/project" --godot "$RTS_WORK/engine/Godot_v4.6.3-stable_linux.x86_64" --archive "$RTS_WORK/source.zip" --manifest "$RTS_WORK/import-manifest.json" --archive-sha256 "$ARCHIVE_SHA" --manifest-sha256 "$MANIFEST_SHA" --output "$RTS_WORK/import-evidence" --xdg "$RTS_WORK/private/import" --hosted-execution-approved
      - name: Retain only exact generated menu import descriptors
        if: always()
        run: |
          python3 - <<'PYRETAIN'
          import hashlib,json,os,pathlib,stat
          work=pathlib.Path(os.environ['RTS_WORK'])
          out=work/'menu-import-descriptors';out.mkdir(exist_ok=False)
          def checked(source,base,limit):
              assert not any(node.is_symlink() for node in [source,*source.parents])
              assert source.resolve().is_relative_to(base.resolve())
              assert stat.S_ISREG(source.stat().st_mode) and source.stat().st_size<=limit
              return source.read_bytes()
          names=['assets/fonts/menu_title_tc.otf.import','assets/mature/menu/valley_keep.png.import','assets/mature/menu/valley_crown_mark.svg.import']
          evidence={'scope':'Actual engine-generated descriptor collection only. Guarded import acceptance remains whatever its original receipt states; no export or gameplay acceptance.','files':{},'missing':[]}
          for name in names:
              source=work/'project'/name
              if not source.exists():evidence['missing'].append(name);continue
              data=checked(source,work/'project',65536);data.decode('utf-8')
              target=out/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              evidence['files'][name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          retained=['import-evidence/phase-summary.json','import-evidence/import.json','import-evidence/import.invocation.json','import-evidence/import.log','export-lock.json']
          for name in retained:
              source=work/name
              if not source.exists():evidence['missing'].append(name);continue
              data=checked(source,work if name=='export-lock.json' else work/'import-evidence',4*1024*1024)
              target=out/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              evidence['files'][name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (out/'collection.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PYRETAIN
      - name: Upload bounded import evidence and exact descriptors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: menu-import-descriptors-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.RTS_WORK }}/menu-import-descriptors/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
