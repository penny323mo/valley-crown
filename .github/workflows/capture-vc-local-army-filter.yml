name: Capture matched Valley Crown local army filter
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/capture-vc-local-army-filter.yml]
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b7158f7a0498cec499f521aba5412fade0d7b84c
          path: reviewed-baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4966433bfca3ebfd7a02f37342e9a58776d94508
          path: reviewed-candidate
          persist-credentials: false
      - name: Install pinned Godot and known software display
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o "$RUNNER_TEMP/vc-first-army-engine.zip"
          unzip -q "$RUNNER_TEMP/vc-first-army-engine.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64"
      - name: Capture same real box selection, plus local filter reveal
        run: |
          bash ci/mobile-local-army/run-local-army-capture.sh \
            "$GITHUB_WORKSPACE/reviewed-baseline" "$GITHUB_WORKSPACE/reviewed-candidate" \
            "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64" ci/mobile-local-army/pins.json \
            "$RUNNER_TEMP/vc-local-army-filter"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vc-ec0980cd3908-native-local-army-filter
          path: ${{ runner.temp }}/vc-local-army-filter/
          retention-days: 30
          if-no-files-found: ignore
