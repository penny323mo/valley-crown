name: Capture genuine v128 command-mode comparison
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-v128-command-mode.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Bind official engine, exact artifact bytes and reviewed capture tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'e3dcd5bfa10403da57bde314ec8be879628fe8068665eca2cb094bd628d5d6f2  ci/capture-v128-command-mode.gd' | sha256sum --strict -c
          echo '980e5f0186966c2e57b896f8abc72c73014d500c9e4b0e3a016fab94807eda85  ci/capture-v128-command-mode-guard.py' | sha256sum --strict -c
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/v128-engine.zip
          unzip -q /tmp/v128-engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --strict -c
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path[:0]=['scripts']
          from web_release_archive import GitHub,verified_members
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          pairs=[('before', {'artifact_id': 14506551959, 'run_id': 44474288511, 'build': 'vc-57c047cf2ab6', 'metadata_sha256': '4cef3baea414fddfa7de99974d65c2153bf8d65b94158de4729219a221ee135e', 'zip_sha256': '3006eb300a062cc9dd79b29b479696b06a3b653d4c49331d5b23f1708479c8c9'}, '3ba2cf47b11e9d790e1585a803902d080d5ae374', 'f37ee49486c7abb2757b9eb901ca69179aff01ec', 'bca24dc0dd016ff0e5a4d7fd1f6550c6f6d05da0'), ('after', {'artifact_id': 14529662253, 'run_id': 44520317998, 'build': 'vc-59f3607d0a76', 'metadata_sha256': '38802ebc196296c506f02f06e49d710f03134709880a08478d242f3058e58f26', 'zip_sha256': 'c336d51e33d3abd6a6fe732c1718f7cdef75e55561e44d4aadc0843532580b33'}, 'fad2c405b115ffdd10881e312c12df56bc70ed7b', 'aba7d61362281f4998b0b13a7f1d01f78f60590c', '94e501661c4daf7522bbc6f7e22b8b1e90d455d0')]
          for label,row,workflow_head,source,tree in pairs:
              run=g.request('/actions/runs/'+str(row['run_id']))
              assert run['conclusion']=='success' and run['head_sha']==workflow_head
              a=g.request('/actions/artifacts/'+str(row['artifact_id']))
              assert not a['expired'] and a['workflow_run']['id']==row['run_id']
              files=verified_members(g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True),row)
              metadata=json.loads(files['candidate-metadata.json'])
              assert metadata['source_commit']==source and metadata['game_tree']==tree
              pck=files['artifacts/clean-a/index.pck']
              assert pck==files['artifacts/clean-b/index.pck']
              path=pathlib.Path('/tmp/v128-capture')/label;path.mkdir(parents=True)
              (path/'index.pck').write_bytes(pck)
              (path/'capture.gd').write_bytes(pathlib.Path('ci/capture-v128-command-mode.gd').read_bytes())
              (path/'input.json').write_text(json.dumps({'label':label,'source_commit':source,'game_tree':tree,
                  'build':row['build'],'pck_sha256':hashlib.sha256(pck).hexdigest()}))
          PY
      - name: Run bounded captures serially with original CPU, memory and wall limits
        run: |
          set -euo pipefail
          python3 -B ci/capture-v128-command-mode-guard.py /tmp/v128-capture/before vc-57c047cf2ab6
          python3 -B ci/capture-v128-command-mode-guard.py /tmp/v128-capture/after vc-59f3607d0a76
      - name: Verify authentic same-stage comparison
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/v128-capture')
          for label,expected in [('before','vc-57c047cf2ab6'),('after','vc-59f3607d0a76')]:
              p=root/label
              d=json.loads((p/'images/report.json').read_text())
              run=json.loads((p/'native-render-receipt.json').read_text())
              info=json.loads((p/'input.json').read_text())
              assert d['complete'] and d['failed']==0 and len(d['checks'])==11
              assert d['build']==expected==info['build'] and len(d['rows'])==1
              assert d['rows'][0]['tick']==200 and d['rows'][0]['viewport']=='(390, 844)'
              assert d['rows'][0]['mode']=='barracks' and d['rows'][0]['bank']['wood']==200000
              assert run['returncode']==0 and run['process_group_gone'] and run['stop_reason'] is None
              assert run['inputs']['index.pck']==info['pck_sha256'] and run['after']['oom']==run['baseline']['oom']
              data=(p/'images/02-barracks-preview.png').read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n') and hashlib.sha256(data).hexdigest()==d['rows'][0]['sha256']
              assert data[12:16]==b'IHDR' and int.from_bytes(data[16:20],'big')==390 and int.from_bytes(data[20:24],'big')==844
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v128-genuine-portrait-ab
          path: |
            /tmp/v128-capture/*/input.json
            /tmp/v128-capture/*/images/*.png
            /tmp/v128-capture/*/images/report.json
            /tmp/v128-capture/*/native-render-*.json
            /tmp/v128-capture/*/native-render-*.txt
          retention-days: 30
          if-no-files-found: error
