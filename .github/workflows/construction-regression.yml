name: Validate integrated construction regressions
on:
  push:
    branches: [ci/construction-regression-v1]
    paths: ['.github/workflows/construction-regression.yml', 'ci/**', '*.json', '*.zip']
permissions:
  contents: read
  actions: read
jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reviewed public inputs
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          for name,digest in json.loads(pathlib.Path('PUBLIC_INPUTS.json').read_text()).items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          PYCODE
      - name: Fetch previously accepted licensed character artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13560214428'
          run-id: '42339730042'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: licensed-artifact
          merge-multiple: true
      - name: Fetch accepted native runtime delta
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13563191390'
          run-id: '42345297400'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-artifact
          merge-multiple: true
      - name: Reassemble exact accepted 181 files without a test overlay
        run: |
          set -euo pipefail
          python3 ci/assemble_combined.py
          python3 ci/apply_action_fix.py --project project --base-lock SOURCE_INPUT_LOCK.json --fix-lock ACTION_FIX_SOURCE_LOCK.json --overlay action-presentation-fix-v1.zip --receipt assembly-action-fix.json
          python3 ci/apply_native_delta.py
          python3 ci/apply_occlusion_overlay.py --project project --accepted-lock native-artifact/accepted-runtime/final-source-lock.json --package OCCLUSION_SOURCE_PACKAGE.json --package-sha256 52711be56c32b5f1a8b861ff4578843cebd3e16a1501b78466a5ac0492ad05aa --overlay occlusion-source-overlay-v3.zip --archive occlusion-source.zip --receipt assembly-occlusion.json
          python3 ci/apply_construction_overlay.py --project project --accepted-lock OCCLUSION_SOURCE_PACKAGE.json --package CONSTRUCTION_SOURCE_PACKAGE.json --package-sha256 069473af06b2519fb4fff01c774533e76ac07eb77d89b7d918064ad1e7f92bb4 --overlay construction-overlay.zip --archive construction-source.zip --receipt assembly-construction.json
      - name: Verify pinned official engine
        run: |
          set -euo pipefail
          mkdir engine
          curl --fail --location --retry 2 -o engine/linux.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q engine/linux.zip -d engine
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  engine/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --check --strict
          chmod +x engine/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Guarded native import
        run: |
          set -euo pipefail
          python3 ci/guarded_manifest_ci.py import --project project --godot "$GODOT" --archive construction-source.zip --manifest CONSTRUCTION_REGRESSION_PACKAGE.json --archive-sha256 a4740d4e00862128d06dea1030dfd0efea6c9c0e8bc0e89f3a0396b5314d8f98 --manifest-sha256 f9473eac11baf62982d67df333ed9cb74f43c8e826e22e200907f0e9c99355bd --xdg private/import --hosted-execution-approved --output evidence/source-import
      - name: Run focused integrated regression contracts
        id: native_test
        run: |
          set -euo pipefail
          python3 ci/guarded_manifest_ci.py test --project project --godot "$GODOT" --archive construction-source.zip --manifest CONSTRUCTION_REGRESSION_PACKAGE.json --archive-sha256 a4740d4e00862128d06dea1030dfd0efea6c9c0e8bc0e89f3a0396b5314d8f98 --manifest-sha256 f9473eac11baf62982d67df333ed9cb74f43c8e826e22e200907f0e9c99355bd --xdg private/import --hosted-execution-approved --output evidence/source-tests
      - name: Admit declared bounded native evidence
        id: native_scan
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          echo '249fc8063075c607b1beba32718a244f7d85223183ec47e4a489fc91a0cfbe56  ci/scan_native_evidence.py' | sha256sum --check --strict
          python3 ci/scan_native_evidence.py
      - name: Retain only admitted native evidence
        if: ${{ !cancelled() && steps.native_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: construction-regression-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/
            evidence-scan.json
          if-no-files-found: error
          retention-days: 14
