name: Compare genuine landscape battle briefing before and candidate
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-v141-briefing-pilot.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {role: baseline}
          - {role: candidate}
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri

      - name: Bind exact original source and reviewed content-only prototype
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin e2beeda5af306e3e18ba7983e72c2c524815ffb2
          test "$(git rev-parse e2beeda5af306e3e18ba7983e72c2c524815ffb2:game)" = 10cd03224304d312693302b7417ba02e08763462
          dir=/tmp/v141-briefing-pilot
          mkdir -p "$dir/project"
          git archive e2beeda5af306e3e18ba7983e72c2c524815ffb2:game | tar -xf - -C "$dir/project"
          cp ci/audit-v141-briefing-capture.gd "$dir/capture.gd"
          echo '3b1223e65baf0112aa39ca521ddcaf6a6b88a342d094cd83bbb98496ceb85949  /tmp/v141-briefing-pilot/capture.gd' | sha256sum --strict -c
          echo '198135ef42a07c9704f257d905ca5ad8fb32930e93c0f5e874a48b78179acccd  ci/audit-v141-briefing-guard.py' | sha256sum --strict -c
          python3 -B - <<'PY'
          import hashlib,json,pathlib,os
          d=pathlib.Path("/tmp/v141-briefing-pilot"); role=os.environ['ROLE']; identity={}
          assert role in ['baseline','candidate']
          for path,(name,before,after) in {'scripts/main_menu.gd': ('scripts__main_menu.gd', '29413b161540ec82344d3f058107d161972956a60d6bd65be3c82b75b82882e7', 'ef1a2a15e6b8c59c05111e62ec93d6d1866d73fa4497bc92e677d5b4c0f73d9e'), 'scripts/battlefield_preview.gd': ('scripts__battlefield_preview.gd', 'e773b6d1a411f1153354ca70b5251522add75a16ea776950eb41f186345f7890', '954ea475256071ee1b6156519158b46e2b0667d2aafd3a588eeb7b14b1006deb'), 'scripts/battle_selection.gd': ('scripts__battle_selection.gd', 'b4d41a5ea4e67149a8d613d45a36a2cbfae6ff5f5bdafabd59c8a08fb8cb2acc', '90cda522a46b9f9a1d864796bdbab6ec6a95e69d19bfcd629133d29bd42ed365')}.items():
              target=d/'project'/path
              data=(pathlib.Path("ci/audit-v141-briefing-pilot")/name).read_bytes()
              assert hashlib.sha256(target.read_bytes()).hexdigest()==before,path
              assert hashlib.sha256(data).hexdigest()==after,path
              if role=='candidate':target.write_bytes(data)
              identity[path]=hashlib.sha256(target.read_bytes()).hexdigest()
          (d/'overlay.json').write_text(json.dumps({'role':role,'exact_published_baseline_commit':'e2beeda5af306e3e18ba7983e72c2c524815ffb2','game_tree':'10cd03224304d312693302b7417ba02e08763462','bound_source':identity}))
          PY
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/v139-river-engine.zip
          unzip -q /tmp/v139-river-engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --strict -c
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
      - name: Import a clean isolated project with existing monitored runtime limits
        run: |
          python3 -B - <<'PY'
          import sys,os,pathlib,json
          sys.path.insert(0,"ci")
          from hardened_monitored_run import run,Limits
          root=pathlib.Path("/tmp/v141-briefing-pilot")
          env=dict(os.environ,HOME=str(root),XDG_DATA_HOME=str(root/"import-data"),XDG_CONFIG_HOME=str(root/"config"),XDG_CACHE_HOME=str(root/"cache"))
          for k in ["XDG_DATA_HOME","XDG_CONFIG_HOME","XDG_CACHE_HOME"]:pathlib.Path(env[k]).mkdir(exist_ok=True)
          argv=["/tmp/Godot_v4.6.3-stable_linux.x86_64","--headless","--path",str(root/"project"),"--editor","--import","--quit"]
          l=Limits(timeout_s=255,max_rss_kib=2097152,launch_min_available_kib=4194304,runtime_min_available_kib=1048576,terminate_grace_s=5,kill_reap_grace_s=5)
          result=run(str(root/"import"),argv,env=env,limits=l)
          print(json.dumps({k:result[k] for k in ['passed','seconds','exit','cleanup_complete','output_errors','stop_reason']}))
          assert result["passed"]
          PY
      - name: Render real battle menu after ordinary touches and actual selected mode
        env:
          ROLE: ${{ matrix.role }}
        run: python3 -B ci/audit-v141-briefing-guard.py /tmp/v141-briefing-pilot vc-b93dd669a7ce 640 360 "$ROLE"
      - name: Validate images, actual title/goal fit and proper game launch
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          r=pathlib.Path("/tmp/v141-briefing-pilot")
          overlay=json.loads((r/'overlay.json').read_text()); role=overlay['role']
          j=json.loads((r/'images/report.json').read_text())
          g=json.loads((r/'native-render-receipt.json').read_text())
          assert j['failed']==0 and all(c['passed'] for c in j['checks'])
          assert j['size']==[640,360] and j['build']=='vc-b93dd669a7ce' and j['role']==role
          assert j['long_goal_visible']==(role=='candidate')
          assert g['returncode']==0 and g['stop_reason'] is None and g['live_process_group_gone'] and g['after']['oom']==g['baseline']['oom']
          for path,digest in overlay['bound_source'].items():assert g['inputs']['project/'+path]==digest
          assert set(j['images'])=={'river-briefing','long-goal-briefing'}
          for key,row in j['images'].items():
              image=(r/'images'/(key+'.png')).read_bytes()
              assert image[:8]==bytes.fromhex('89504e470d0a1a0a') and hashlib.sha256(image).hexdigest()==row['sha256'] and row['size']==[640,360]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v141-briefing-pilot-${{ matrix.role }}
          path: |
            /tmp/v141-briefing-pilot/overlay.json
            /tmp/v141-briefing-pilot/import.json
            /tmp/v141-briefing-pilot/native-render-*
            /tmp/v141-briefing-pilot/images/*.png
            /tmp/v141-briefing-pilot/images/report.json
          retention-days: 30
          if-no-files-found: error
