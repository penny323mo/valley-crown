name: Reviewed material native conversion
on:
  push:
    branches: [ci/material-native-proof-v1]
    paths:
      - '.github/workflows/material-native.yml'
      - 'ACTION_FIX_SOURCE_LOCK.json'
      - 'ARCHER_EFFECT_SOURCE_PACKAGE.json'
      - 'CONSTRUCTION_SOURCE_PACKAGE.json'
      - 'DELIVERY.json'
      - 'DELIVERY_FILES.json'
      - 'DELIVERY_REVIEW.json'
      - 'GENERATION_REVIEW.json'
      - 'GROUND_RALLY_SOURCE_PACKAGE.json'
      - 'GROUND_RALLY_TEXT_SOURCE_PACKAGE.json'
      - 'GUIDANCE_SOURCE_PACKAGE.json'
      - 'MATERIAL_NATIVE_INPUTS.json'
      - 'MATERIAL_SOURCE_INPUTS.json'
      - 'NATIVE_REVIEW.json'
      - 'OCCLUSION_SOURCE_PACKAGE.json'
      - 'SELECTION_SOURCE_PACKAGE.json'
      - 'SOURCE_INPUT_LOCK.json'
      - 'STALE_HINT_SOURCE_PACKAGE.json'
      - 'UNITBAR_SOURCE_PACKAGE.json'
      - 'action-presentation-fix-v1.zip'
      - 'archer-effect-overlay.zip'
      - 'ci/apply_action_fix.py'
      - 'ci/apply_archer_effect_overlay.py'
      - 'ci/apply_construction_overlay.py'
      - 'ci/apply_ground_rally_overlay.py'
      - 'ci/apply_ground_rally_text_overlay.py'
      - 'ci/apply_guidance_overlay.py'
      - 'ci/apply_native_delta.py'
      - 'ci/apply_occlusion_overlay.py'
      - 'ci/apply_selection_overlay.py'
      - 'ci/apply_stale_hint_overlay.py'
      - 'ci/apply_unitbar_overlay.py'
      - 'ci/assemble_combined.py'
      - 'ci/build_licensed_action_characters.py'
      - 'ci/collect_native_failure.py'
      - 'ci/hardened_monitored_run.py'
      - 'construction-overlay.zip'
      - 'delivery_helpers.py'
      - 'ground-rally-overlay.zip'
      - 'ground-rally-text-overlay.zip'
      - 'guidance-overlay.zip'
      - 'map80-actions-thin-source-v2.zip'
      - 'occlusion-source-overlay-v3.zip'
      - 'rts_material_render_gate/assemble_material_source.py'
      - 'rts_material_render_gate/delivery/native/BASELINE_CHAIN.json'
      - 'rts_material_render_gate/delivery/native/reconstruct_baseline.py'
      - 'rts_material_render_gate/delivery/native/run_delivery.py'
      - 'rts_material_render_gate/native/BASELINE_192.json'
      - 'rts_material_render_gate/native/probe_native_materials.gd'
      - 'rts_material_render_gate/native/run_material_native.py'
      - 'rts_material_render_gate/native/scan_material_native.py'
      - 'rts_material_validation_review/compare_glb_nonmaterial.py'
      - 'selection-overlay.zip'
      - 'stale-hint-overlay.zip'
      - 'unitbar-overlay.zip'
permissions:
  contents: read
  actions: read
concurrency:
  group: reviewed-material-native
  cancel-in-progress: false
jobs:
  native:
    # Exact isolated material-test branch only; final contract also requires peer review.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/ci/material-native-proof-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact complete source tree and review preflight
        run: /usr/bin/python3 delivery_helpers.py preflight --contract DELIVERY.json --mode native
      - name: Fetch exact accepted artifact archives and members
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          /usr/bin/python3 delivery_helpers.py fetch --contract DELIVERY.json --key old_licensed
          /usr/bin/python3 delivery_helpers.py fetch --contract DELIVERY.json --key old_native
          /usr/bin/python3 delivery_helpers.py fetch --contract DELIVERY.json --key generated
      - name: Fetch and verify official engine without executing it
        run: /usr/bin/python3 delivery_helpers.py engine --contract DELIVERY.json
      - name: Reassemble, convert and independently scan exact native evidence
        id: native
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          /usr/bin/python3 -c 'import json,pathlib,sys; review=json.loads(pathlib.Path("NATIVE_REVIEW.json").read_text()); assert str(pathlib.Path(sys.executable).resolve()) == review["execution_paths"]["python"], "Reviewed interpreter path differs"'
          /usr/bin/python3 rts_material_render_gate/delivery/native/run_delivery.py --contract DELIVERY.json --stage all
      - name: Upload only independently scanned39 native files
        if: ${{ success() && steps.native.outputs.native_scanned == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-material-native
          path: material-work/safe-native/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Collect bounded UNACCEPTED native engine failure diagnostics
        if: ${{ failure() && steps.native.outcome == 'failure' }}
        id: failure_diagnostics
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: /usr/bin/python3 ci/collect_native_failure.py --source material-work/native-evidence --destination material-work/UNACCEPTED-native-diagnostics --failure-confirmed
      - name: Upload UNACCEPTED diagnostics only after cleanup and privacy checks
        if: ${{ failure() && steps.native.outcome == 'failure' && steps.failure_diagnostics.outputs.diagnostics_scanned == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UNACCEPTED-DIAGNOSTIC-material-native
          path: material-work/UNACCEPTED-native-diagnostics/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
