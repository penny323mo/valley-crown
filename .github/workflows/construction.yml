name: Validate bounded construction presentation
on:
  push:
    branches: [ci/construction-presentation-v1]
    paths: ['.github/workflows/construction.yml', 'ci/**', '*.json', '*.zip']
permissions:
  contents: read
  actions: read
jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require reviewed exact touch inputs
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          lock=json.loads(pathlib.Path('ci/native-touch-build-lock.json').read_text())
          assert lock['reviewed_for_execution'] is True and lock['build']=='vc-43276605e0fb'
          assert lock['fixed_fps']==20 and lock['touch_contract']['flow']=='touch-build'
          assert len(lock['project_files'])==192 and len(lock['allowed_generated_uid_files'])==5
          for name,digest in lock['support_files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          PYCODE
      - name: Fetch previously accepted licensed character artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13560214428'
          run-id: '42339730042'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: licensed-artifact
          merge-multiple: true
      - name: Fetch accepted native runtime delta
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13563191390'
          run-id: '42345297400'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-artifact
          merge-multiple: true
      - name: Reassemble exact accepted 181 files without a test overlay
        run: |
          set -euo pipefail
          python3 ci/assemble_combined.py
          python3 ci/apply_action_fix.py --project project --base-lock SOURCE_INPUT_LOCK.json --fix-lock ACTION_FIX_SOURCE_LOCK.json --overlay action-presentation-fix-v1.zip --receipt assembly-action-fix.json
          python3 ci/apply_native_delta.py
          python3 ci/apply_occlusion_overlay.py --project project --accepted-lock native-artifact/accepted-runtime/final-source-lock.json --package OCCLUSION_SOURCE_PACKAGE.json --package-sha256 52711be56c32b5f1a8b861ff4578843cebd3e16a1501b78466a5ac0492ad05aa --overlay occlusion-source-overlay-v3.zip --archive occlusion-source.zip --receipt assembly-occlusion.json
          python3 ci/apply_construction_overlay.py --project project --accepted-lock OCCLUSION_SOURCE_PACKAGE.json --package CONSTRUCTION_SOURCE_PACKAGE.json --package-sha256 069473af06b2519fb4fff01c774533e76ac07eb77d89b7d918064ad1e7f92bb4 --overlay construction-overlay.zip --archive construction-source.zip --receipt assembly-construction.json
      - name: Install official Ubuntu display dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb dash x11-xkb-utils libgl1-mesa-dri libglx-mesa0 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64
      - name: Verify pinned official engine
        run: |
          set -euo pipefail
          mkdir engine
          curl --fail --location --retry 2 -o engine/linux.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q engine/linux.zip -d engine
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  engine/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --check --strict
          chmod +x engine/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Guarded native import
        run: |
          set -euo pipefail
          python3 ci/guarded_manifest_ci.py import --project project --godot "$GODOT" --archive construction-source.zip --manifest CONSTRUCTION_SOURCE_PACKAGE.json --archive-sha256 a4740d4e00862128d06dea1030dfd0efea6c9c0e8bc0e89f3a0396b5314d8f98 --manifest-sha256 069473af06b2519fb4fff01c774533e76ac07eb77d89b7d918064ad1e7f92bb4 --xdg private/import --hosted-execution-approved --output evidence/source-import
      - name: One controlled native geometry and observation contract
        id: native_test
        run: |
          set -euo pipefail
          python3 ci/guarded_manifest_ci.py test --project project --godot "$GODOT" --archive construction-source.zip --manifest CONSTRUCTION_SOURCE_PACKAGE.json --archive-sha256 a4740d4e00862128d06dea1030dfd0efea6c9c0e8bc0e89f3a0396b5314d8f98 --manifest-sha256 069473af06b2519fb4fff01c774533e76ac07eb77d89b7d918064ad1e7f92bb4 --xdg private/import --hosted-execution-approved --output evidence/source-tests
      - name: Admit declared bounded native evidence
        id: native_scan
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          echo 'f68957a3e0c0e73d9cfbb945dcfaeae14c25a04e2d0740abd1a671e344e22fc5  ci/scan_native_evidence.py' | sha256sum --check --strict
          python3 ci/scan_native_evidence.py
      - name: Retain only admitted native evidence
        if: ${{ !cancelled() && steps.native_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: construction-native-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/
            evidence-scan.json
          if-no-files-found: error
          retention-days: 14
  phone-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require reviewed exact touch inputs
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          lock=json.loads(pathlib.Path('ci/native-touch-build-lock.json').read_text())
          assert lock['reviewed_for_execution'] is True and lock['build']=='vc-43276605e0fb'
          assert lock['fixed_fps']==20 and lock['touch_contract']['flow']=='touch-build'
          assert len(lock['project_files'])==192 and len(lock['allowed_generated_uid_files'])==5
          for name,digest in lock['support_files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          PYCODE
      - name: Fetch previously accepted licensed character artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13560214428'
          run-id: '42339730042'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: licensed-artifact
          merge-multiple: true
      - name: Fetch accepted native runtime delta
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13563191390'
          run-id: '42345297400'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-artifact
          merge-multiple: true
      - name: Reassemble exact accepted 181 files without a test overlay
        run: |
          set -euo pipefail
          python3 ci/assemble_combined.py
          python3 ci/apply_action_fix.py --project project --base-lock SOURCE_INPUT_LOCK.json --fix-lock ACTION_FIX_SOURCE_LOCK.json --overlay action-presentation-fix-v1.zip --receipt assembly-action-fix.json
          python3 ci/apply_native_delta.py
          python3 ci/apply_occlusion_overlay.py --project project --accepted-lock native-artifact/accepted-runtime/final-source-lock.json --package OCCLUSION_SOURCE_PACKAGE.json --package-sha256 52711be56c32b5f1a8b861ff4578843cebd3e16a1501b78466a5ac0492ad05aa --overlay occlusion-source-overlay-v3.zip --archive occlusion-source.zip --receipt assembly-occlusion.json
          python3 ci/apply_construction_overlay.py --project project --accepted-lock OCCLUSION_SOURCE_PACKAGE.json --package CONSTRUCTION_SOURCE_PACKAGE.json --package-sha256 069473af06b2519fb4fff01c774533e76ac07eb77d89b7d918064ad1e7f92bb4 --overlay construction-overlay.zip --archive construction-source.zip --receipt assembly-construction.json
      - name: Install official Ubuntu display dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb dash x11-xkb-utils libgl1-mesa-dri libglx-mesa0 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64
      - name: Verify pinned official engine
        run: |
          set -euo pipefail
          mkdir engine
          curl --fail --location --retry 2 -o engine/linux.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q engine/linux.zip -d engine
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  engine/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --check --strict
          chmod +x engine/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Guarded native import
        run: |
          set -euo pipefail
          python3 ci/guarded_manifest_ci.py import --project project --godot "$GODOT" --archive construction-source.zip --manifest CONSTRUCTION_SOURCE_PACKAGE.json --archive-sha256 a4740d4e00862128d06dea1030dfd0efea6c9c0e8bc0e89f3a0396b5314d8f98 --manifest-sha256 069473af06b2519fb4fff01c774533e76ac07eb77d89b7d918064ad1e7f92bb4 --xdg private/import --hosted-execution-approved --output import-evidence
      - name: Capture the independent normal touch subflow
        id: capture_touch
        run: |
          set -euo pipefail
          python3 ci/run_native.py --project project --godot "$GODOT" --harness ci/capture_touch.gd --lock ci/native-touch-build-lock.json --import-marker private/import/import-complete.json --output evidence/touch-build --private private/touch-build --width 390 --height 844
          python3 ci/scan_touch.py --directory evidence/touch-build --lock ci/native-touch-build-lock.json --report evidence/touch-build-scan.json
      - name: Report bounded touch progress after capture
        if: ${{ !cancelled() && steps.capture_touch.outcome != 'skipped' }}
        run: python3 ci/touch_progress.py --log evidence/touch-build/godot.log
      - name: Retain independently scanned ordinary touch section
        if: ${{ success() && steps.capture_touch.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: construction-phone-build-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/touch-build/
            evidence/touch-build-scan.json
          if-no-files-found: error
          retention-days: 14
      - name: Require settled HUD to match the normal completed-house snapshot
        if: ${{ success() && steps.capture_touch.outcome == 'success' }}
        run: |
          python3 - <<'PYCODE'
          import json
          result=json.load(open('evidence/touch-build-scan.json'))
          ok=result.get('passed') is True and result.get('visual_findings')==[]
          print('HUD_SETTLE_GATE '+('PASS' if ok else 'FAIL'))
          raise SystemExit(0 if ok else 1)
          PYCODE
