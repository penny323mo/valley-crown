name: Capture genuine v133 campaign progress after actual victory and reopening
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-v133-campaign-retention.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Bind official engine, exact artifact bytes and reviewed capture tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'ac86c6969868e7e51b6b891369b1f2e1c54554a1c31bac55b227dd2e1099dfda  ci/capture-v133-campaign-retention.gd' | sha256sum --strict -c
          echo '980e5f0186966c2e57b896f8abc72c73014d500c9e4b0e3a016fab94807eda85  ci/capture-v133-campaign-retention-guard.py' | sha256sum --strict -c
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/v133-engine.zip
          unzip -q /tmp/v133-engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --strict -c
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path[:0]=['scripts']
          from web_release_archive import GitHub,verified_members
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          row,workflow_head,source,tree=({'artifact_id': 14556422156, 'run_id': 44572319526, 'build': 'vc-90bd13ae58b8', 'metadata_sha256': 'd8734d69e21900fdf301344e8a5e61995218026583f5a4f37d0b807bd24fdd63', 'zip_sha256': '105536faadb417945a3655b9b8b3fc7b08d659edd1f1308dcc2a1291dcf151ab'}, '573c0a95349137c113ee720cb9c4b485ec93f277', 'f6d9d413f50c193c008fd29447e4ea75198e862e', '7d56d49a8c395e4ac230fffee1dd2f993d1ba7e3')
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']==workflow_head
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          files=verified_members(g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True),row)
          m=json.loads(files['candidate-metadata.json'])
          assert m['source_commit']==source and m['game_tree']==tree
          pck=files['artifacts/clean-a/index.pck']
          assert pck==files['artifacts/clean-b/index.pck']
          path=pathlib.Path('/tmp/v133-capture');path.mkdir()
          (path/'index.pck').write_bytes(pck)
          (path/'capture.gd').write_bytes(pathlib.Path('ci/capture-v133-campaign-retention.gd').read_bytes())
          (path/'input.json').write_text(json.dumps({'source_commit':source,'game_tree':tree,'build':row['build'],'pck_sha256':hashlib.sha256(pck).hexdigest()}))
          PY
      - name: Run bounded played siege and reopened local chapter progress capture
        run: python3 -B ci/capture-v133-campaign-retention-guard.py /tmp/v133-capture vc-90bd13ae58b8
      - name: Verify authentic re-opened campaign progress PNG
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/v133-capture')
          d=json.loads((p/'images/report.json').read_text())
          run=json.loads((p/'native-render-receipt.json').read_text())
          info=json.loads((p/'input.json').read_text())
          assert d['complete'] and len(d['checks'])==20 and all(x['passed'] for x in d['checks'])
          assert d['build']=='vc-90bd13ae58b8'==info['build']
          assert run['returncode']==0 and run['process_group_gone'] and run['stop_reason'] is None
          assert run['inputs']['index.pck']==info['pck_sha256'] and run['after']['oom']==run['baseline']['oom']
          assert d['won'] and d['tick']==4590 and d['completed']==1 and d['revision']==1
          image=d['image']; assert image['width']==390 and image['height']==844
          data=(p/'images'/'campaign-progress-reopened.png').read_bytes()
          assert data.startswith(bytes.fromhex('89504e470d0a1a0a')) and hashlib.sha256(data).hexdigest()==image['sha256']
          assert data[12:16]==b'IHDR' and int.from_bytes(data[16:20],'big')==390 and int.from_bytes(data[20:24],'big')==844
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v133-campaign-retention-real-native
          path: |
            /tmp/v133-capture/input.json
            /tmp/v133-capture/images/*.png
            /tmp/v133-capture/images/report.json
            /tmp/v133-capture/native-render-*.json
            /tmp/v133-capture/native-render-*.txt
          retention-days: 30
          if-no-files-found: error
