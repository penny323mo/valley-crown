name: Validate ordinary ground rally feature
on:
  push:
    branches: [ci/native-ground-rally-v1]
    paths: ['.github/workflows/ground-rally.yml', 'ci/**', '*.json', '*.zip']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact reviewed public inputs
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import pathlib,json,hashlib
          for name,digest in json.loads(pathlib.Path('PUBLIC_INPUTS.json').read_text()).items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          PYCODE
      - name: Fetch previously accepted licensed character artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13560214428'
          run-id: '42339730042'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: licensed-artifact
          merge-multiple: true
      - name: Fetch accepted native runtime delta
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13563191390'
          run-id: '42345297400'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-artifact
          merge-multiple: true
      - name: Reassemble exact accepted 181 files without a test overlay
        run: |
          set -euo pipefail
          python3 ci/assemble_combined.py
          python3 ci/apply_action_fix.py --project project --base-lock SOURCE_INPUT_LOCK.json --fix-lock ACTION_FIX_SOURCE_LOCK.json --overlay action-presentation-fix-v1.zip --receipt assembly-action-fix.json
          python3 ci/apply_native_delta.py
          python3 ci/apply_occlusion_overlay.py --project project --accepted-lock native-artifact/accepted-runtime/final-source-lock.json --package OCCLUSION_SOURCE_PACKAGE.json --package-sha256 52711be56c32b5f1a8b861ff4578843cebd3e16a1501b78466a5ac0492ad05aa --overlay occlusion-source-overlay-v3.zip --archive occlusion-source.zip --receipt assembly-occlusion.json
          python3 ci/apply_construction_overlay.py --project project --accepted-lock OCCLUSION_SOURCE_PACKAGE.json --package CONSTRUCTION_SOURCE_PACKAGE.json --package-sha256 069473af06b2519fb4fff01c774533e76ac07eb77d89b7d918064ad1e7f92bb4 --overlay construction-overlay.zip --archive construction-source.zip --receipt assembly-construction.json
      - name: Apply accepted unit-bar base then reviewed guidance to disposable source
        run: |
          set -euo pipefail
          python3 ci/apply_unitbar_overlay.py --project project --base-package CONSTRUCTION_SOURCE_PACKAGE.json --package UNITBAR_SOURCE_PACKAGE.json --overlay unitbar-overlay.zip --receipt assembly-unitbar.json
          python3 ci/apply_guidance_overlay.py --project project --base-package UNITBAR_SOURCE_PACKAGE.json --package GUIDANCE_SOURCE_PACKAGE.json --overlay guidance-overlay.zip --receipt assembly-guidance.json
          python3 - <<'PYCODE'
          import json,pathlib,sys
          sys.path.insert(0,'ci')
          from apply_construction_overlay import write_archive
          package=json.loads(pathlib.Path('GUIDANCE_SOURCE_PACKAGE.json').read_text())
          entries={row['file']:row['sha256'] for row in package['files']}
          assert len(entries)==192
          write_archive(pathlib.Path('project'),entries,pathlib.Path('guidance-source.zip'))
          PYCODE
      - name: Apply exact selection-only fix to accepted guidance source
        run: |
          set -euo pipefail
          python3 ci/apply_selection_overlay.py --project project --base-package GUIDANCE_SOURCE_PACKAGE.json --package SELECTION_SOURCE_PACKAGE.json --overlay selection-overlay.zip --receipt assembly-selection.json
          python3 - <<'PYCODE'
          import json,pathlib,sys
          sys.path.insert(0,'ci')
          from apply_construction_overlay import write_archive
          package=json.loads(pathlib.Path('SELECTION_SOURCE_PACKAGE.json').read_text())
          entries={row['file']:row['sha256'] for row in package['files']}
          assert len(entries)==192
          write_archive(pathlib.Path('project'),entries,pathlib.Path('selection-source.zip'))
          PYCODE
      - name: Apply exact owned build-guidance lifecycle fix
        run: |
          set -euo pipefail
          python3 ci/apply_stale_hint_overlay.py --project project --base-package SELECTION_SOURCE_PACKAGE.json --package STALE_HINT_SOURCE_PACKAGE.json --overlay stale-hint-overlay.zip --receipt assembly-stale-hint.json
          python3 - <<'PYCODE'
          import json,pathlib,sys
          sys.path.insert(0,'ci')
          from apply_construction_overlay import write_archive
          package=json.loads(pathlib.Path('STALE_HINT_SOURCE_PACKAGE.json').read_text())
          entries={row['file']:row['sha256'] for row in package['files']}
          assert len(entries)==192
          write_archive(pathlib.Path('project'),entries,pathlib.Path('stale-hint-source.zip'))
          PYCODE
      - name: Apply exact tracked archer cue lifecycle fix
        run: |
          set -euo pipefail
          python3 ci/apply_archer_effect_overlay.py --project project --base-package STALE_HINT_SOURCE_PACKAGE.json --package ARCHER_EFFECT_SOURCE_PACKAGE.json --overlay archer-effect-overlay.zip --receipt assembly-archer-effect.json
          python3 - <<'PYCODE'
          import json,pathlib,sys
          sys.path.insert(0,'ci')
          from apply_construction_overlay import write_archive
          package=json.loads(pathlib.Path('ARCHER_EFFECT_SOURCE_PACKAGE.json').read_text())
          entries={row['file']:row['sha256'] for row in package['files']}
          assert len(entries)==192
          write_archive(pathlib.Path('project'),entries,pathlib.Path('archer-effect-source.zip'))
          PYCODE
      - name: Apply exact ordinary ground rally feature
        run: |
          set -euo pipefail
          python3 ci/apply_ground_rally_overlay.py --project project --base-package ARCHER_EFFECT_SOURCE_PACKAGE.json --package GROUND_RALLY_SOURCE_PACKAGE.json --overlay ground-rally-overlay.zip --receipt assembly-ground-rally.json
          python3 - <<'PYCODE'
          import json,pathlib,sys
          sys.path.insert(0,'ci')
          from apply_construction_overlay import write_archive
          package=json.loads(pathlib.Path('GROUND_RALLY_SOURCE_PACKAGE.json').read_text())
          entries={row['file']:row['sha256'] for row in package['files']}
          assert len(entries)==192
          write_archive(pathlib.Path('project'),entries,pathlib.Path('ground-rally-source.zip'))
          PYCODE
      - name: Verify pinned official engine
        run: |
          set -euo pipefail
          mkdir engine
          curl --fail --location --retry 2 -o engine/linux.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q engine/linux.zip -d engine
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  engine/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --check --strict
          chmod +x engine/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Guarded native import only
        run: |
          set -euo pipefail
          python3 ci/guarded_manifest_ci.py import --project project --godot "$GODOT" --archive ground-rally-source.zip --manifest GROUND_RALLY_SOURCE_PACKAGE.json --archive-sha256 c63c2f79f4ce650b704da040691d1a4b1ac45a6adba05e9228947fa40513be1e --manifest-sha256 8c7c4bde61bbebf1d661f751d791beb9be76bfe562f7138b84dae4fc1eb915de --xdg private/import --hosted-execution-approved --output import-evidence
      - name: One bounded external ground rally feature contract and independent checker
        id: replay
        run: |
          set -euo pipefail
          python3 ci/run_ordinary_replay.py
      - name: Admit bounded partial or complete contract evidence
        id: scan
        if: always() && steps.replay.outcome != 'skipped'
        run: |
          set -euo pipefail
          echo 'd417dc739a705e2825b796874d192a92763469114f91162f57518282d21f4023  ci/scan_replay_evidence.py' | sha256sum --check --strict
          echo '843babee43d6d976879269d21a321d2cc9d533693becc6a4581b95b98445364c  ci/run_ordinary_replay.py' | sha256sum --check --strict
          echo 'f355d11e7da812439f06bf8eddaebb6016716fc88d7c9791f5880c5e475d8142  ci/REPLAY_INPUTS.json' | sha256sum --check --strict
          python3 ci/scan_replay_evidence.py
      - name: Retain only admitted contract evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ground-rally-native-${{ github.sha }}
          path: safe-replay-evidence/
          if-no-files-found: error
          retention-days: 14
