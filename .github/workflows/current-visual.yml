name: Capture accepted f659 gameplay and controlled rig visuals
on:
  push:
    branches: [ci/current-visual-vc-f659b53824e3]
    paths: ['.github/workflows/current-visual.yml', 'ci/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: native-source-visuals
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require all reviewed exact execution locks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          for mode in ('gameplay','rig-studies','occlusion'):
              lock=json.loads(pathlib.Path('ci/native-'+mode+'-lock.json').read_text())
              assert lock['reviewed_for_execution'] is True, 'Draft has not been approved'
              assert lock['build']=='vc-f659b53824e3' and len(lock['project_files'])==181
              assert lock['allowed_generated_uid_files']==[] and lock['diagnostic_only'] is False
              for name,digest in lock['support_files'].items():
                  assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Fetch previously accepted licensed character artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13560214428'
          run-id: '42339730042'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: licensed-artifact
          merge-multiple: true
      - name: Fetch accepted native runtime delta
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13562131524'
          run-id: '42342287459'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-artifact
          merge-multiple: true
      - name: Reassemble exact accepted 181 files without a test overlay
        run: |
          set -euo pipefail
          python3 ci/assemble_combined.py
          python3 ci/apply_native_delta.py
          python3 ci/make_source_archive.py --project project --manifest ci/current-import-manifest.json --output current-source.zip --expected-sha256 b69166f26392b16f6b4a62c14c1636391815f1252aaba2e94d2922725c8c7b74
      - name: Install official Ubuntu display dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb dash x11-xkb-utils libgl1-mesa-dri libglx-mesa0 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64
      - name: Verify pinned official engine
        run: |
          set -euo pipefail
          mkdir engine
          curl --fail --location --retry 2 -o engine/linux.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q engine/linux.zip -d engine
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  engine/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --check --strict
          chmod +x engine/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Fresh exact181 guarded import, distinct from regression182
        run: |
          set -euo pipefail
          python3 ci/guarded_manifest_ci.py import --project project --godot "$GODOT" --archive current-source.zip --manifest ci/current-import-manifest.json --archive-sha256 b69166f26392b16f6b4a62c14c1636391815f1252aaba2e94d2922725c8c7b74 --manifest-sha256 587345c92f663c6203146b06c45ede12caa6ce7528a441a436ab6b2c1a810946 --output import-evidence --xdg private/import --hosted-execution-approved
      - name: Real game portrait opening, walking and woodcutting
        run: |
          set -euo pipefail
          python3 ci/run_native.py --project project --godot "$GODOT" --harness ci/capture_native.gd --lock ci/native-gameplay-lock.json --import-marker private/import/import-complete.json --output evidence/portrait --private private/portrait --width 390 --height 844
          python3 ci/scan_evidence.py --directory evidence/portrait --lock ci/native-gameplay-lock.json --report evidence/portrait-scan.json
      - name: Real game landscape opening, walking and woodcutting
        run: |
          set -euo pipefail
          python3 ci/run_native.py --project project --godot "$GODOT" --harness ci/capture_native.gd --lock ci/native-gameplay-lock.json --import-marker private/import/import-complete.json --output evidence/landscape --private private/landscape --width 844 --height 390
          python3 ci/scan_evidence.py --directory evidence/landscape --lock ci/native-gameplay-lock.json --report evidence/landscape-scan.json
      - name: Controlled current four-class 25-clip studies, not gameplay
        run: |
          set -euo pipefail
          python3 ci/run_native.py --project project --godot "$GODOT" --harness ci/capture_rig_studies.gd --lock ci/native-rig-studies-lock.json --import-marker private/import/import-complete.json --output evidence/rig-studies --private private/rig-studies --width 844 --height 390
          python3 ci/scan_evidence.py --directory evidence/rig-studies --lock ci/native-rig-studies-lock.json --report evidence/rig-studies-scan.json
      - name: Controlled portrait occlusion comparisons, not gameplay
        run: |
          set -euo pipefail
          python3 ci/run_native.py --project project --godot "$GODOT" --harness ci/capture_occlusion.gd --lock ci/native-occlusion-lock.json --import-marker private/import/import-complete.json --output evidence/occlusion --private private/occlusion --width 390 --height 844
          python3 ci/scan_evidence.py --directory evidence/occlusion --lock ci/native-occlusion-lock.json --report evidence/occlusion-scan.json
      - name: Retain only complete scanned native evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-current-visuals-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
