name: Export isolated rendered match diagnostic
on:
  push:
    branches: [ci/rendered-match-diagnostic-vc-79ebcaef19e3]
permissions:
  contents: read
concurrency:
  group: rendered-match-diagnostic-vc-79ebcaef19e3
  cancel-in-progress: false
jobs:
  export:
    # Enabled launcher candidate for exact core review; not published or executed.
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DIAGNOSTIC_EXECUTION_APPROVED: 'true'
    steps:
      - name: Require independently reviewed diagnostic gate
        run: |
          set -euo pipefail
          test "$DIAGNOSTIC_EXECUTION_APPROVED" = true
          test "$GITHUB_REPOSITORY" = penny323mo/valley-crown
          test "$GITHUB_REF" = refs/heads/ci/rendered-match-diagnostic-vc-79ebcaef19e3
          test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select fresh isolated workspace
        run: echo "RTS_WORK=$RUNNER_TEMP/diagnostic-web-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Verify bound tooling and immutable product with explicit diagnostic overlay
        run: |
          set -euo pipefail
          python3 -B ci/preflight_diagnostic.py
          python3 -B ci/prepare_diagnostic_export.py prepare --work "$RTS_WORK"
          python3 -B ci/preflight_diagnostic.py "$RTS_WORK"
      - name: Prepare pinned official engine and single-threaded Web template
        run: |
          set -euo pipefail
          python3 -B ci/prepare_diagnostic_export.py engine --work "$RTS_WORK"
          python3 -B ci/prepare_web_templates.py --work "$RTS_WORK"
      - name: Fresh bounded import using unchanged exact monitor
        run: |
          set -euo pipefail
          source "$RTS_WORK/pins.env"
          python3 -B ci/guarded_manifest_ci.py import --project "$RTS_WORK/project" --godot "$RTS_WORK/engine/Godot_v4.6.3-stable_linux.x86_64" --archive "$RTS_WORK/source.zip" --manifest "$RTS_WORK/import-manifest.json" --archive-sha256 "$ARCHIVE_SHA" --manifest-sha256 "$MANIFEST_SHA" --output "$RTS_WORK/import-evidence" --xdg "$RTS_WORK/private/import" --hosted-execution-approved
      - name: Two guarded diagnostic exports
        run: python3 -B ci/run_export.py --project "$RTS_WORK/project" --godot "$RTS_WORK/engine/Godot_v4.6.3-stable_linux.x86_64" --template "$RTS_WORK/template/web_nothreads_release.zip" --lock "$RTS_WORK/export-lock.json" --import-marker "$RTS_WORK/private/import/import-complete.json" --output "$RTS_WORK/exports" --private "$RTS_WORK/private/export"
      - name: Package separately identified diagnostic candidate
        run: python3 -B ci/package_diagnostic_export.py --work "$RTS_WORK"
      - name: Upload diagnostic candidate for separate exact artifact review
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rendered-match-diagnostic-web-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.RTS_WORK }}/candidate/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rendered-match-diagnostic-export-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.RTS_WORK }}/import-evidence/phase-summary.json
            ${{ env.RTS_WORK }}/import-evidence/import.json
            ${{ env.RTS_WORK }}/import-evidence/import.invocation.json
            ${{ env.RTS_WORK }}/import-evidence/import.log
            ${{ env.RTS_WORK }}/exports/web-export-receipt.json
            ${{ env.RTS_WORK }}/exports/export-1/receipt.json
            ${{ env.RTS_WORK }}/exports/export-1/godot.log
            ${{ env.RTS_WORK }}/exports/export-2/receipt.json
            ${{ env.RTS_WORK }}/exports/export-2/godot.log
            ${{ env.RTS_WORK }}/source-policy-lock.json
            ${{ env.RTS_WORK }}/import-manifest.json
            ${{ env.RTS_WORK }}/export-lock.json
            ${{ env.RTS_WORK }}/template-provenance.json
            ${{ env.RTS_WORK }}/diagnostic-export-manifest.json
            ${{ env.RTS_WORK }}/diagnostic-export-summary.json
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
# No browser consumer, deploy step, Pages permission, military test retry, or product mutation.
