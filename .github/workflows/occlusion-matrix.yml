          python3 ci/apply_native_delta.py
          python3 ci/apply_occlusion_overlay.py --project project --accepted-lock native-artifact/accepted-runtime/final-source-lock.json --package OCCLUSION_SOURCE_PACKAGE.json --package-sha256 52711be56c32b5f1a8b861ff4578843cebd3e16a1501b78466a5ac0492ad05aa --overlay occlusion-source-overlay-v3.zip --archive occlusion-source.zip --receipt assembly-occlusion.json
      - name: Install official Ubuntu display dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb dash x11-xkb-utils libgl1-mesa-dri libglx-mesa0 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64
      - name: Verify pinned official engine
        run: |
          set -euo pipefail
          mkdir engine
          curl --fail --location --retry 2 -o engine/linux.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q engine/linux.zip -d engine
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  engine/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --check --strict
          chmod +x engine/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Guarded fresh exact source import
        run: |
          set -euo pipefail
          python3 ci/guarded_manifest_ci.py import --project project --godot "$GODOT" --archive occlusion-source.zip --archive-sha256 fd9d9f3d2fe759fb0fa0df80d0a9813c16ff8725922d3d930dc75b194b81de8a --xdg private/import --hosted-execution-approved --manifest OCCLUSION_SOURCE_PACKAGE.json --manifest-sha256 52711be56c32b5f1a8b861ff4578843cebd3e16a1501b78466a5ac0492ad05aa --output import-evidence
      - name: Capture and admit exact section
        id: capture
        run: |
          set -euo pipefail
          python3 ci/run_native.py --project project --godot "$GODOT" --harness ci/capture_occlusion_matrix.gd --lock ci/native-occlusion-matrix-lock.json --import-marker private/import/import-complete.json --output evidence/section --private private/render --width 390 --height 600
          python3 ci/scan_matrix.py --directory evidence/section --lock ci/native-occlusion-matrix-lock.json --report evidence/admission.json
      - name: Retain admitted section before strict pixel acceptance
        if: ${{ success() && steps.capture.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: stencil-scene_matrix67-${{ github.sha }}
          path: |
            evidence/section/
            evidence/admission.json
          if-no-files-found: error
          retention-days: 14
      - name: Strict independent section pixel acceptance
        run: |
          set -euo pipefail
          python3 ci/check_matrix_pixels.py --directory evidence/section --lock ci/native-occlusion-matrix-lock.json --report pixel-acceptance.json
