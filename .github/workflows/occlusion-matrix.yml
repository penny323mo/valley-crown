name: Validate broader stencil scenes and viewport lifecycle
on:
  push:
    branches: [ci/occlusion-matrix-v1]
    paths: ['.github/workflows/occlusion-matrix.yml', 'ci/**', '*.json', '*.zip']
permissions:
  contents: read
  actions: read
jobs:
  native_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reviewed manifest and execution locks
        run: |
          set -euo pipefail
          echo '83761b13eddf74ee43ab21bc1e24bbd3190d9507506e760ee629baccf92db3d9  ci/PUBLIC_INPUTS.sha256' | sha256sum --check --strict
          sha256sum --check --strict ci/PUBLIC_INPUTS.sha256
          python3 -c 'import json; assert all(json.load(open("ci/native-occlusion-"+x+"-lock.json"))["reviewed_for_execution"] is True for x in ["matrix","lifecycle"])'
      - name: Fetch previously accepted licensed character artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13560214428'
          run-id: '42339730042'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: licensed-artifact
          merge-multiple: true
      - name: Fetch accepted native runtime delta
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13563191390'
          run-id: '42345297400'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-artifact
          merge-multiple: true
      - name: Reassemble exact accepted 181 files without a test overlay
        run: |
          set -euo pipefail
          python3 ci/assemble_combined.py
          python3 ci/apply_action_fix.py --project project --base-lock SOURCE_INPUT_LOCK.json --fix-lock ACTION_FIX_SOURCE_LOCK.json --overlay action-presentation-fix-v1.zip --receipt assembly-action-fix.json
          python3 ci/apply_native_delta.py
          python3 ci/apply_occlusion_overlay.py --project project --accepted-lock native-artifact/accepted-runtime/final-source-lock.json --package OCCLUSION_SOURCE_PACKAGE.json --package-sha256 52711be56c32b5f1a8b861ff4578843cebd3e16a1501b78466a5ac0492ad05aa --overlay occlusion-source-overlay-v3.zip --archive occlusion-source.zip --receipt assembly-occlusion.json
      - name: Install official Ubuntu display dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb dash x11-xkb-utils libgl1-mesa-dri libglx-mesa0 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64
      - name: Verify pinned official engine
        run: |
          set -euo pipefail
          mkdir engine
          curl --fail --location --retry 2 -o engine/linux.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q engine/linux.zip -d engine
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  engine/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --check --strict
          chmod +x engine/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Guarded fresh exact source import
        run: |
          set -euo pipefail
          python3 ci/guarded_manifest_ci.py import --project project --godot "$GODOT" --archive occlusion-source.zip --archive-sha256 fd9d9f3d2fe759fb0fa0df80d0a9813c16ff8725922d3d930dc75b194b81de8a --xdg private/import --hosted-execution-approved --manifest OCCLUSION_NATIVE_CONTRACTS.json --manifest-sha256 cecdfe1c4f20ffeeab3aedc0bc2f085957e2f37f75496ce1078faa9feaa44154 --output import-evidence
      - name: Guarded geometry and observation contracts
        id: contracts
        run: |
          set -euo pipefail
          python3 ci/guarded_manifest_ci.py test --project project --godot "$GODOT" --archive occlusion-source.zip --archive-sha256 fd9d9f3d2fe759fb0fa0df80d0a9813c16ff8725922d3d930dc75b194b81de8a --xdg private/import --hosted-execution-approved --manifest OCCLUSION_NATIVE_CONTRACTS.json --manifest-sha256 cecdfe1c4f20ffeeab3aedc0bc2f085957e2f37f75496ce1078faa9feaa44154 --output contract-evidence
      - name: Bounded native scalar result diagnostics
        if: always() && steps.contracts.outcome != 'skipped'
        run: |
          set -euo pipefail
          echo 'c7919be1b19fb2c34eac1068ffd52ccd4db33c359730febcd161e3a0d6e31097  ci/summarize_matrix_contracts.py' | sha256sum --check --strict
          python3 ci/summarize_matrix_contracts.py
