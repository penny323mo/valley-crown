name: Preserve verified raw Web seed for independent host
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/publish_web_seed.py
      - .github/workflows/publish-web-seed.yml
permissions:
  contents: read
concurrency:
  group: durable-web-seed
  cancel-in-progress: false
jobs:
  seed:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Restore pinned current candidate from durable archive and seed it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import sys,json,pathlib,hashlib,os
          sys.path.insert(0,'scripts')
          from web_release_archive import GitHub,verified_members
          build='vc-8a55620acab1'
          row=next(r for r in json.loads(pathlib.Path('release-history/VERIFIED_CANDIDATE_ARCHIVES.json').read_text())['artifacts'] if r['build']==build)
          if os.environ.get('LOCAL_ZIP'):
           data=pathlib.Path(os.environ['LOCAL_ZIP']).read_bytes(); files=verified_members(data,row)
          else:
           _,data,files=GitHub(os.environ['GITHUB_REPOSITORY']).ensure(row,create=False)
          m=json.loads(files['candidate-metadata.json']); root=pathlib.Path('seed-current'); root.mkdir(exist_ok=True)
          for name,data in files.items():
           for prefix in ('artifacts/clean-a/','notices/'):
            if name.startswith(prefix):
             p=root/name[len(prefix):]; p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          manifest={'build':build,'source_commit':m['source_commit'],'export_run':m['export_run'],'files_sha256':{p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()},'browser_acceptance':'not performed; owner requested immediate deployment','single_threaded':True}
          (root/'WEB_EXPORT_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n'); (root/'.nojekyll').touch()
          catalog={'files':{'builds/'+build+'/'+p.relative_to(root).as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()}}
          pathlib.Path('seed-current-catalog.json').write_text(json.dumps(catalog,indent=2)+'\n')
          PY
          python3 scripts/publish_web_seed.py --build vc-8a55620acab1 --directory seed-current --catalog seed-current-catalog.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-raw-web-seed-${{ github.run_id }}
          path: web-seed-report.json
          retention-days: 30
          if-no-files-found: error
