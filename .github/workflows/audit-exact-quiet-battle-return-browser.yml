name: Audit exact stock 480×270 Standard battle return in Chromium
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-exact-quiet-battle-return-browser.yml]
permissions:
  contents: read
  actions: read
jobs:
  stock-quiet-return:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        role: [baseline, candidate]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Wait for real 1× Standard combat, acknowledge, pan away and verify the interactive drawer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '5e2a278f300a9e4558d39001055841acce70378e3b53449c3041aaff69c5f475  ci/quiet-return-web/quiet-proof.py' | sha256sum --strict --check
          echo 'd4a7e8eb40286920201bb90a2efefbec1cc267561dc45577c33cea2732a8f109  ci/quiet-return-web/pins.json' | sha256sum --strict --check
          echo '07ef064054d6d1a66ceb8c01de2cf8a84d67abc3a756533ca7e47bf36d16c740  ci/map-edge-webgl-stock/stock-proof.py' | sha256sum --strict --check
          echo 'ede588f6ee877b5af8f35880d463d39d37065c92740c6f958443e10f6aceb5ad  ci/map-edge-webgl-stock/gl-observe.js' | sha256sum --strict --check
          google-chrome --version
          timeout --kill-after=15s 610s python3 -B ci/quiet-return-web/quiet-proof.py ci/quiet-return-web/pins.json "$RUNNER_TEMP/vc-quiet-return-web" "${{ matrix.role }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vc-561fdd2865e3-stock-quiet-return-chromium-480-${{ matrix.role }}
          path: ${{ runner.temp }}/vc-quiet-return-web/
          retention-days: 30
          if-no-files-found: warn
