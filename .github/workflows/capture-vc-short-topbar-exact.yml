name: Capture exact stamped Valley Crown compact toolbar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/capture-vc-short-topbar-exact.yml]
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 727bfc928d6962df34095b00076abba4a07eaf16
          path: exact-short-topbar-baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5afa32159c331bbafdd923fe305e4fbf97318150
          path: exact-short-topbar-candidate
          persist-credentials: false
      - name: Install pinned Godot and known software display
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o "$RUNNER_TEMP/vc-exact-short-topbar-engine.zip"
          unzip -q "$RUNNER_TEMP/vc-exact-short-topbar-engine.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64"
      - name: Render exact compact toolbar with routed Menu, Idle and Pause on both committed games
        run: |
          bash ci/short-topbar-exact/run.sh \
            "$GITHUB_WORKSPACE/exact-short-topbar-baseline" "$GITHUB_WORKSPACE/exact-short-topbar-candidate" \
            "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/vc-exact-short-topbar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vc-2bf736f4bf15-native-exact-short-topbar
          path: ${{ runner.temp }}/vc-exact-short-topbar/
          retention-days: 30
          if-no-files-found: ignore
