name: Check integrated game source
on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/source-checks.yml'
  pull_request:
    paths:
      - 'game/**'
      - '.github/workflows/source-checks.yml'
permissions:
  contents: read
jobs:
  source-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source identity, dependencies and integration contracts
        run: python3 -B game/tools/check_source.py
