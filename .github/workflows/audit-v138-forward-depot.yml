name: Audit v138 exact Web Frontline Depot actual home delivery exclusion
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-v138-forward-depot.yml]
permissions:
  contents: read
  actions: read
jobs:
  browser:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact real product archive and isolate browser files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '8e183b0ee4f48de58a348525ba6c8e312cfa5d2175d8c93e12dab6ae6df4a1b3  ci/audit-v138-forward-depot.py' | sha256sum --strict -c
          google-chrome --version
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,re,sys
          sys.path.insert(0,'scripts')
          from web_release_archive import GitHub,verified_members
          row={'artifact_id': 14580174918, 'run_id': 44626413569, 'build': 'vc-ce2efc75244b', 'metadata_sha256': '3dd5ebf42f693b612b3843f8ef9c4eed43b4722d3d03d843080f12f80fa406b9', 'zip_sha256': '7cd2eec672926e643d8885f4903fb6f050cfd450db55dd4e7990bd84ed693397'}
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']=='e9e51f952bc156f43f1880ee12da53428f1f4b68'
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          data=g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True)
          members=verified_members(data,row)
          identity=json.loads(members['candidate-metadata.json'])
          assert identity['source_commit']=='521dfb8b65191c8b4a0c8452272bdc46bdeaa06a' and identity['game_tree']=='a16eb9691c6a592fa41e720ea149f71377257c0b'
          dest=pathlib.Path('/tmp/v133-browser-proof');dest.mkdir()
          for path,data in members.items():
              if path.startswith('artifacts/clean-a/'):
                  name=path.split('/')[-1]
                  assert name.startswith('index.')
                  (dest/name).write_bytes(data)
          (dest/'probe.html').write_text('<!doctype html><title>local disposable browser proof</title>')
          (dest/'input.json').write_text(json.dumps(row))
          PY
      - name: Run exact Web mission and ordinary home cargo without scoring
        run: python3 -B ci/audit-v138-forward-depot.py /tmp/v133-browser-proof candidate vc-ce2efc75244b
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v138-forward-depot-browser-proof
          path: |
            /tmp/v133-browser-proof/input.json
            /tmp/v133-browser-proof/browser-proof.json
            /tmp/v133-browser-proof/chromedriver.log
            /tmp/v133-browser-proof/browser-console.json
            /tmp/v133-browser-proof/*-actual-battle.png
          retention-days: 15
          if-no-files-found: error
