name: Validate combined native gameplay and rig events
on:
  push:
    branches: [ci/map80-actions-regression-v1]
    paths: ['.github/workflows/combined-regression.yml', 'ci/**', '*.json', '*.zip']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact reviewed inputs
        run: |
          set -euo pipefail
          echo '3e7bfc4565bdf9e3c947cf0be566f9f8fd16f0ab7ff711837a4f49cf1904c2a1  ci/PUBLIC_INPUTS.sha256' | sha256sum --check --strict
          sha256sum --check --strict ci/PUBLIC_INPUTS.sha256
      - name: Fetch previously accepted licensed character inputs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13560214428'
          run-id: '42339730042'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: licensed-artifact
          merge-multiple: true
      - name: Fetch accepted native runtime delta
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13562131524'
          run-id: '42342287459'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-artifact
          merge-multiple: true
      - name: Reassemble exact accepted native runtime
        run: |
          set -euo pipefail
          python3 ci/assemble_combined.py
          python3 ci/apply_native_delta.py
      - name: Bind one test overlay to accepted runtime
        run: |
          set -euo pipefail
          python3 ci/pack_regression_source.py --project project --package SCOPED_CI_PACKAGE.json --accepted-lock native-artifact/accepted-runtime/final-source-lock.json --overlay action-game-test-overlay-v2.zip --archive f659-combined-regression-source.zip --receipt assembly-regression.json
      - name: Record runner resource preflight
        run: |
          mkdir evidence engine
          { uname -a; free -h; df -h .; nproc; } | tee evidence/runner-resources.log
      - name: Install pinned official engine
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 -o engine/linux.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q engine/linux.zip -d engine
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  engine/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --check --strict
          chmod +x engine/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Guarded import of exact182 source
        run: |
          set -euo pipefail
          python3 ci/guarded_manifest_ci.py import --project project --godot "$GODOT" --archive f659-combined-regression-source.zip --manifest SCOPED_CI_PACKAGE.json --archive-sha256 166be32c4d861153f244bca3e6644b8ac2bda3ec6170655a18bb1bfaf63b6465 --manifest-sha256 a2c7780e2ad3fbeda13646c06bf8edf5cca9795a6cca3b3512ef80b10ef21c7d --hosted-execution-approved --output evidence/source-import --xdg cache/regression
      - name: Guarded thirteen combined suites
        run: |
          set -euo pipefail
          python3 ci/guarded_manifest_ci.py test --project project --godot "$GODOT" --archive f659-combined-regression-source.zip --manifest SCOPED_CI_PACKAGE.json --archive-sha256 166be32c4d861153f244bca3e6644b8ac2bda3ec6170655a18bb1bfaf63b6465 --manifest-sha256 a2c7780e2ad3fbeda13646c06bf8edf5cca9795a6cca3b3512ef80b10ef21c7d --hosted-execution-approved --output evidence/source-tests --xdg cache/regression
      - name: Scan exact safe evidence
        id: scan
        if: always()
        run: |
          set -euo pipefail
          echo 'b63a74726453a742ebdc0e55c264955c7a576381ca3a0a1f851b8dfc797227a2  ci/scan_regression_evidence.py' | sha256sum --check --strict
          python3 ci/scan_regression_evidence.py
      - name: Retain scanned combined regression evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: combined-native-regression
          path: |
            evidence/
            evidence-scan.json
          if-no-files-found: error
          retention-days: 14
