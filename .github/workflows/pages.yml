      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: Wait for uploaded Pages artifact to become visible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PYVISIBLE'
          import json,os,time,urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100"
          for attempt in range(20):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=20) as response: data=json.load(response)
              artifacts=[a for a in data['artifacts'] if a['name']=='github-pages' and not a['expired']]
              if len(artifacts)==1:
                  print('Pages artifact metadata visible:',artifacts[0]['id'])
                  break
              if len(artifacts)>1: raise SystemExit('Ambiguous Pages artifact identity')
              print('Waiting for uploaded artifact metadata',attempt+1)
              time.sleep(3)
          else: raise SystemExit('Uploaded Pages artifact not visible within bounded wait')
          PYVISIBLE
