name: Publish verified phone-controls test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact reviewed candidate artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13833927602'
          run-id: '42973027221'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
          merge-multiple: true
      - name: Verify every candidate byte and package public assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          import hashlib,json,pathlib,shutil
          root=pathlib.Path('candidate')
          expected={'clean-a/GODOT-LICENSES.txt': 'f0d10be03fc4d21a7e0ce642206746f7448025af3c57ef1778535811d646ac5f', 'clean-a/THIRD_PARTY_NOTICES.txt': '8833bc5c11f9c130e545fe94650e05687383c37fdf45ab79ebe584bbc4ae63bb', 'artifacts/clean-a/index.apple-touch-icon.png': '9b374ecbc8558f480421e646f38aaa8a69d5b1d65ff7b48d0735da214c46773a', 'artifacts/clean-a/index.wasm': '26b61ce95247012ab3dca3ff51e96d1cdbff44ee91a8c20a83e150afca83f1b6', 'artifacts/clean-a/index.png': '3cb4495c0b98dfbe4b663cbf2b6836473572339beb66d902367893162a70be0e', 'artifacts/clean-a/index.audio.position.worklet.js': 'be33985bc7160d6bf9646f259cd86b259cd67b02ccb297ee5c44f8ac84327bc8', 'artifacts/clean-a/index.icon.png': '08808dd5397e9a502cb3624944151f87a9705b5b66b5c365c5ca4c6ab51525f5', 'artifacts/clean-a/index.js': 'e3f56ee40e6f84371053db06692cfac15e2c8659547b11c6b2dfa1996dabd981', 'artifacts/clean-a/index.pck': 'c8981d6bb7e6a50d692424b226d3f838419008a13ce40baa6908323600550bf8', 'artifacts/clean-a/index.audio.worklet.js': '5b476a9c9ce642c0ee4256436d1bc31d9c38f868aca0f9a8e2a57c18d2dec2a3', 'artifacts/clean-a/index.html': '1f3e1bb0e71c4223bf5bdc4c3f9847c7d1f624f41a5c5a0b7fdc03f52dce18ff', 'artifacts/clean-b/index.apple-touch-icon.png': '9b374ecbc8558f480421e646f38aaa8a69d5b1d65ff7b48d0735da214c46773a', 'artifacts/clean-b/index.wasm': '26b61ce95247012ab3dca3ff51e96d1cdbff44ee91a8c20a83e150afca83f1b6', 'artifacts/clean-b/index.png': '3cb4495c0b98dfbe4b663cbf2b6836473572339beb66d902367893162a70be0e', 'artifacts/clean-b/index.audio.position.worklet.js': 'be33985bc7160d6bf9646f259cd86b259cd67b02ccb297ee5c44f8ac84327bc8', 'artifacts/clean-b/index.icon.png': '08808dd5397e9a502cb3624944151f87a9705b5b66b5c365c5ca4c6ab51525f5', 'artifacts/clean-b/index.js': 'e3f56ee40e6f84371053db06692cfac15e2c8659547b11c6b2dfa1996dabd981', 'artifacts/clean-b/index.pck': 'c8981d6bb7e6a50d692424b226d3f838419008a13ce40baa6908323600550bf8', 'artifacts/clean-b/index.audio.worklet.js': '5b476a9c9ce642c0ee4256436d1bc31d9c38f868aca0f9a8