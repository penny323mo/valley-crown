name: Audit actual v133 browser battle touch and rotation
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-v133-battle-touch.yml]
permissions:
  contents: read
  actions: read
jobs:
  browser:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact real product archive and isolate browser files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '3c76bc1bf13c3a3850945df5f6993bb9687623c55e987c9b24ed6b6945ca1828  ci/audit-v133-battle-touch.py' | sha256sum --strict -c
          google-chrome --version
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,re,sys
          sys.path.insert(0,'scripts')
          from web_release_archive import GitHub,verified_members
          row={'artifact_id': 14556422156, 'run_id': 44572319526, 'build': 'vc-90bd13ae58b8', 'metadata_sha256': 'd8734d69e21900fdf301344e8a5e61995218026583f5a4f37d0b807bd24fdd63', 'zip_sha256': '105536faadb417945a3655b9b8b3fc7b08d659edd1f1308dcc2a1291dcf151ab'}
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']=='573c0a95349137c113ee720cb9c4b485ec93f277'
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          data=g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True)
          members=verified_members(data,row)
          identity=json.loads(members['candidate-metadata.json'])
          assert identity['source_commit']=='f6d9d413f50c193c008fd29447e4ea75198e862e' and identity['game_tree']=='7d56d49a8c395e4ac230fffee1dd2f993d1ba7e3'
          dest=pathlib.Path('/tmp/v133-browser-proof');dest.mkdir()
          for path,data in members.items():
              if path.startswith('artifacts/clean-a/'):
                  name=path.split('/')[-1]
                  assert name.startswith('index.')
                  (dest/name).write_bytes(data)
          (dest/'probe.html').write_text('<!doctype html><title>local disposable browser proof</title>')
          (dest/'input.json').write_text(json.dumps(row))
          PY
      - name: Run real Web export with ordinary battle taps, real movement and rotation
        run: python3 -B ci/audit-v133-battle-touch.py /tmp/v133-browser-proof battle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v133-actual-battle-touch-audit
          path: |
            /tmp/v133-browser-proof/input.json
            /tmp/v133-browser-proof/browser-proof.json
            /tmp/v133-browser-proof/chromedriver.log
            /tmp/v133-browser-proof/browser-console.json
            /tmp/v133-browser-proof/*-actual-battle.png
          retention-days: 15
          if-no-files-found: error
