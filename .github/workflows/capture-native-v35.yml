name: Capture v100 paid siege maintenance
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-native-v35.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    strategy:
      matrix:
        scenario: [siege-service]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Download and verify exact engine and candidate PCK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/capture
          curl -fL https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/engine.zip
          unzip /tmp/engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum -c -
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 - <<'PYCODE'
          import sys,pathlib,os,hashlib,json
          sys.path.insert(0,'scripts')
          from web_release_archive import GitHub,verified_members
          row={'artifact_id': 14359192015, 'run_id': 44146285993, 'build': 'vc-6d18e3dd5d49', 'metadata_sha256': '70bdaa880f148227de2a4fadff8163a256445ac4dadfa8a780f3b70b4c8c8b57', 'zip_sha256': '12ddc73f1815e44a01c858dc3a9c11d07d108923db5b24da0082353498283422'}
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          run=g.request('/actions/runs/44146285993')
          assert run['conclusion']=='success' and run['head_sha']=='02222010147e1c45d2a975ed0bf155c5d988e17b' and run['run_attempt']==1
          meta=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not meta['expired'] and meta['workflow_run']['id']==row['run_id']
          data=g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True)
          files=verified_members(data,row)
          m=json.loads(files['candidate-metadata.json'])
          assert m['source_commit']=='dc16ef4b9081ac20375869092fe87857ae6eda00' and m['game_tree']=='eff66eb1545fdde727199a6a452f2f57fac6ec0f'
          pck=files['artifacts/clean-a/index.pck']
          assert hashlib.sha256(pck).hexdigest()=='6220dce7e6288b0ca2ea525bf3221c25e2675fed93e37bfcec588637a52242f9'
          pathlib.Path('/tmp/capture/index.pck').write_bytes(pck)
          assert hashlib.sha256(pathlib.Path('ci/capture-siege-service.gd').read_bytes()).hexdigest()=='b64e30361ce070a8093621553a95f79b72556ba927f884c6280423a61663eeb9'
          PYCODE
          cp ci/capture-siege-service.gd /tmp/capture/capture.gd
      - name: Resource guarded genuine native rendering with low-memory softpipe at bounded resolution
        run: |
          echo '22f97ec51bc82ecde1bdd339799a7e2039292b11a0d4c8270b54e4455c8b3c1b  ci/capture-siege-service-guard.py' | sha256sum -c -
          python3 ci/capture-siege-service-guard.py
      - name: Verify rendered product capture identity and successful checks
        run: |
          python3 - <<'PYVERIFY'
          import json,pathlib,hashlib
          r=json.loads(pathlib.Path('/tmp/siege-service-capture/report.json').read_text())
          assert r['build']=='vc-6d18e3dd5d49' and r['driver_sha256']=='b64e30361ce070a8093621553a95f79b72556ba927f884c6280423a61663eeb9'
          assert type(r['failed']) is int and r['failed']==0 and len(r['checks'])==11 and all(c['passed'] is True for c in r['checks'])
          assert len(r['captures'])==3 and all(c['metadata_only'] is False and pathlib.Path(c['file']).is_file() for c in r['captures'])
          assert all(hashlib.sha256(pathlib.Path(c['file']).read_bytes()).hexdigest()==c['sha256'] for c in r['captures'])
          PYVERIFY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genuine-v100-siege-service-${{ matrix.scenario }}
          path: |
            /tmp/siege-service-capture/*.png
            /tmp/siege-service-capture/report.json
            /tmp/capture/*receipt.json
            /tmp/capture/wall-natural-proof.json
            /tmp/capture/wall-natural-contract.json
            /tmp/capture/*stdout.txt
            /tmp/capture/*stderr.txt
          if-no-files-found: error

