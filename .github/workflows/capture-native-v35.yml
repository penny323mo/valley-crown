name: Capture v84 paid wall rows from clear overhead inspection camera
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-native-v35.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    strategy:
      matrix:
        scenario: [wall_rows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Download and verify exact engine and candidate PCK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/capture
          curl -fL https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/engine.zip
          unzip /tmp/engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum -c -
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 - <<'PYCODE'
          import sys,io,zipfile,hashlib,pathlib,os
          sys.path.insert(0,'scripts')
          from web_release_archive import GitHub
          data=GitHub(os.environ['GITHUB_REPOSITORY']).request('/actions/artifacts/14312874531/zip',binary=True)
          assert hashlib.sha256(data).hexdigest()=='7dcdde8978e9838611a1e16f1d7cb89fa957d456c76615747ced524ba33e9a33'
          pck=zipfile.ZipFile(io.BytesIO(data)).read('artifacts/clean-a/index.pck')
          assert hashlib.sha256(pck).hexdigest()=='46a51be52078312c825b9d37519669a8655e4f00544b3134df91accc9bb21ccd'
          pathlib.Path('/tmp/capture/index.pck').write_bytes(pck)
          PYCODE
          cp ci/capture-wall-batch-natural.gd /tmp/capture/capture.gd
      - name: Resource guarded genuine native rendering with low-memory softpipe at bounded resolution
        run: python3 ci/capture-expedition-journey-guard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genuine-v84-wall-rows-${{ matrix.scenario }}
          path: |
            /tmp/wall-batch-capture/*.png
            /tmp/wall-batch-capture/wall-batch-proof.json
            /tmp/capture/*receipt.json
            /tmp/capture/wall-natural-proof.json
            /tmp/capture/wall-natural-contract.json
            /tmp/capture/*stdout.txt
            /tmp/capture/*stderr.txt
          if-no-files-found: error

