name: Capture v102 waiting production locator
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-native-v35.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    strategy:
      matrix:
        scenario: [production-wait]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Download and verify exact engine and candidate PCK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/capture
          curl -fL https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/engine.zip
          unzip /tmp/engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum -c -
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 - <<'PYCODE'
          import sys,pathlib,os,hashlib,json
          sys.path.insert(0,'scripts')
          from web_release_archive import GitHub,verified_members
          row={'artifact_id': 14364355608, 'run_id': 44159179255, 'build': 'vc-6e3a18d1ae30', 'metadata_sha256': '9adece9929805ac8ccaf772559dbce12e05334aa2e75981f6a5a02c8365053bb', 'zip_sha256': '36ae8068bc77deebf9646cac6581e4ef09e5a08f41f1365352c93dd435465664'}
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          run=g.request('/actions/runs/44159179255')
          assert run['conclusion']=='success' and run['head_sha']=='c3db2b0d3a0ba7a18d160f1ed6e5f32c4afd5089' and run['run_attempt']==1
          meta=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not meta['expired'] and meta['workflow_run']['id']==row['run_id']
          data=g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True)
          files=verified_members(data,row)
          m=json.loads(files['candidate-metadata.json'])
          assert m['source_commit']=='01ef00a27eaf8724392bae4b798be1d6893ad737' and m['game_tree']=='2cd04f46f055f455ab6e95b81e0dc1dfbba7485e'
          pck=files['artifacts/clean-a/index.pck']
          assert hashlib.sha256(pck).hexdigest()=='2794b18dc101a804a40868070a79bfcf9382399d5ba9f1720de13d35e27758b7'
          pathlib.Path('/tmp/capture/index.pck').write_bytes(pck)
          assert hashlib.sha256(pathlib.Path('ci/capture-production.gd').read_bytes()).hexdigest()=='d951ca3edf2ca362dac099636a071424e5124f13334a197f8466e6105b929933'
          PYCODE
          cp ci/capture-production.gd /tmp/capture/capture.gd
      - name: Resource guarded genuine native rendering with low-memory softpipe at bounded resolution
        run: |
          echo 'c082deededb751393350bbe4af8d7987f81724038bc55401a2cf02cf14975c43  ci/capture-production-guard.py' | sha256sum -c -
          python3 ci/capture-production-guard.py
      - name: Verify rendered product capture identity and successful checks
        run: |
          python3 - <<'PYVERIFY'
          import json,pathlib,hashlib
          r=json.loads(pathlib.Path('/tmp/production-wait-capture/report.json').read_text())
          assert r['build']=='vc-6e3a18d1ae30' and r['driver_sha256']=='d951ca3edf2ca362dac099636a071424e5124f13334a197f8466e6105b929933'
          assert type(r['failed']) is int and r['failed']==0 and len(r['checks'])==14 and all(c['passed'] is True for c in r['checks'])
          assert len(r['captures'])==3 and all(c['metadata_only'] is False and pathlib.Path(c['file']).is_file() for c in r['captures'])
          assert all(hashlib.sha256(pathlib.Path(c['file']).read_bytes()).hexdigest()==c['sha256'] for c in r['captures'])
          PYVERIFY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genuine-v102-production-wait-${{ matrix.scenario }}
          path: |
            /tmp/production-wait-capture/*.png
            /tmp/production-wait-capture/report.json
            /tmp/capture/*receipt.json
            /tmp/capture/wall-natural-proof.json
            /tmp/capture/wall-natural-contract.json
            /tmp/capture/*stdout.txt
            /tmp/capture/*stderr.txt
          if-no-files-found: error

