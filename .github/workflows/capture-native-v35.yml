name: Capture v98 touch controls and command icons
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-native-v35.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    strategy:
      matrix:
        scenario: [touch-icons]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Download and verify exact engine and candidate PCK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/capture
          curl -fL https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/engine.zip
          unzip /tmp/engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum -c -
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 - <<'PYCODE'
          import sys,pathlib,os,hashlib,json
          sys.path.insert(0,'scripts')
          from web_release_archive import GitHub,verified_members
          row={'artifact_id': 14352901322, 'run_id': 44134348202, 'build': 'vc-3f88723c3b41', 'metadata_sha256': '91fdcf37e6a3f3f3b302a156c229580cc1960cdb758d56970ed99b580982c35e', 'zip_sha256': '0bcc2ff5a54f6fa1392254843af975614bb98a55204238906262ec70d92ec144'}
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          run=g.request('/actions/runs/44134348202')
          assert run['conclusion']=='success' and run['head_sha']=='da264b83173a7731722d44d4313e8d10c995cdb1' and run['run_attempt']==1
          meta=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not meta['expired'] and meta['workflow_run']['id']==row['run_id']
          data=g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True)
          files=verified_members(data,row)
          m=json.loads(files['candidate-metadata.json'])
          assert m['source_commit']=='5d7723a408375e204dc6f36f153a54c174e9aac4' and m['game_tree']=='72acbebd3b4811765c74e256bb162721c3ace8a0'
          pck=files['artifacts/clean-a/index.pck']
          assert hashlib.sha256(pck).hexdigest()=='ac462f031cc595677e6bf7850574234203b7c35f27537bf4115f5c193768dad1'
          pathlib.Path('/tmp/capture/index.pck').write_bytes(pck)
          assert hashlib.sha256(pathlib.Path('ci/capture-touch-icons.gd').read_bytes()).hexdigest()=='bd6523f7a5f94619fafed40956e7a79f08ab01a2fda5095a73ad6bcf39363abf'
          PYCODE
          cp ci/capture-touch-icons.gd /tmp/capture/capture.gd
      - name: Resource guarded genuine native rendering with low-memory softpipe at bounded resolution
        run: python3 ci/capture-touch-icons-guard.py
      - name: Verify rendered product capture identity and successful checks
        run: |
          python3 - <<'PYVERIFY'
          import json,pathlib,hashlib
          r=json.loads(pathlib.Path('/tmp/touch-icons-capture/report.json').read_text())
          assert r['build']=='vc-3f88723c3b41' and r['driver_sha256']=='bd6523f7a5f94619fafed40956e7a79f08ab01a2fda5095a73ad6bcf39363abf'
          assert type(r['failed']) is int and r['failed']==0 and r['checks'] and all(c['passed'] is True for c in r['checks'])
          assert r['captures'] and all(c['metadata_only'] is False and pathlib.Path(c['file']).is_file() for c in r['captures'])
          assert all(hashlib.sha256(pathlib.Path(c['file']).read_bytes()).hexdigest()==c['sha256'] for c in r['captures'])
          PYVERIFY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genuine-v98-touch-icons-${{ matrix.scenario }}
          path: |
            /tmp/touch-icons-capture/*.png
            /tmp/touch-icons-capture/report.json
            /tmp/capture/*receipt.json
            /tmp/capture/wall-natural-proof.json
            /tmp/capture/wall-natural-contract.json
            /tmp/capture/*stdout.txt
            /tmp/capture/*stderr.txt
          if-no-files-found: error

