name: Capture v69 protected checkpoint and accurate restored mission
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-native-v35.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    strategy:
      matrix:
        scenario: [journey, menu]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Download and verify exact engine and candidate PCK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/capture
          curl -fL https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/engine.zip
          unzip /tmp/engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum -c -
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 - <<'PYCODE'
          import sys,io,zipfile,hashlib,pathlib,os
          sys.path.insert(0,'scripts')
          from web_release_archive import GitHub
          data=GitHub(os.environ['GITHUB_REPOSITORY']).request('/actions/artifacts/14212194107/zip',binary=True)
          assert hashlib.sha256(data).hexdigest()=='ac5aa59ad11774637780fdcc9fb31fa943a0c59d8843719d54381048fe679a4e'
          pck=zipfile.ZipFile(io.BytesIO(data)).read('artifacts/clean-a/index.pck')
          assert hashlib.sha256(pck).hexdigest()=='aa25764f352dd1ce70a4d389547cc77699793e16859eced7408c4fbd6ebc9066'
          pathlib.Path('/tmp/capture/index.pck').write_bytes(pck)
          PYCODE
          if [ "${{ matrix.scenario }}" = "journey" ]; then cp ci/capture-v68-checkpoint-journey.gd /tmp/capture/capture.gd; else cp ci/capture-v68-checkpoint-menu.gd /tmp/capture/capture.gd; fi
      - name: Resource guarded genuine native rendering with low-memory softpipe at bounded resolution
        run: python3 ci/capture-expedition-journey-guard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genuine-v69-checkpoint-${{ matrix.scenario }}
          path: |
            /tmp/capture/*.png
            /tmp/capture/*receipt.json
            /tmp/capture/*stdout.txt
            /tmp/capture/*stderr.txt
          if-no-files-found: error
