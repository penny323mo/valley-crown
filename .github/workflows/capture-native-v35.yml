name: Verify v83 post-breach advance and real keep attack
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-native-v35.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    strategy:
      matrix:
        scenario: [wall_continuation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Download and verify exact engine and candidate PCK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/capture
          curl -fL https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/engine.zip
          unzip /tmp/engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum -c -
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 - <<'PYCODE'
          import sys,io,zipfile,hashlib,pathlib,os
          sys.path.insert(0,'scripts')
          from web_release_archive import GitHub
          data=GitHub(os.environ['GITHUB_REPOSITORY']).request('/actions/artifacts/14260210257/zip',binary=True)
          assert hashlib.sha256(data).hexdigest()=='53bf7537085b14e0731c40c163bda30ef42ce64b16fa098c163fa5fcec4b4b28'
          pck=zipfile.ZipFile(io.BytesIO(data)).read('artifacts/clean-a/index.pck')
          assert hashlib.sha256(pck).hexdigest()=='1f848ae1167bf2b2a49e63897a8f787b7800664d718a71c5fcdb44b8c1730f36'
          pathlib.Path('/tmp/capture/index.pck').write_bytes(pck)
          PYCODE
          cp ci/capture-wall-natural-continuation.gd /tmp/capture/capture.gd
      - name: Verify controlled real-tick wall continuation and recovery
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 2097152 -t 60
          export HOME=/tmp/capture XDG_DATA_HOME=/tmp/capture/contract-data XDG_CONFIG_HOME=/tmp/capture/contract-config XDG_CACHE_HOME=/tmp/capture/contract-cache
          timeout --signal=TERM --kill-after=5s 70s /tmp/Godot_v4.6.3-stable_linux.x86_64 --headless --main-pack /tmp/capture/index.pck --script ci/wall_continuation_contract.gd > /tmp/capture/wall-continuation-stdout.txt 2> /tmp/capture/wall-continuation-stderr.txt
          python3 - <<'PY'
          import json,pathlib
          lines=pathlib.Path('/tmp/capture/wall-continuation-stdout.txt').read_text().splitlines()
          report=next(json.loads(line) for line in reversed(lines) if line.startswith('{'))
          assert report['suite']=='wall_continuation_contract' and report['failed']==0 and len(report['checks'])==10
          assert all(row['passed'] for row in report['checks'])
          print('All ten controlled continuation checks passed')
          PY
      - name: Resource guarded genuine native rendering with low-memory softpipe at bounded resolution
        run: python3 ci/capture-expedition-journey-guard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genuine-v83-wall-continuation-${{ matrix.scenario }}
          path: |
            /tmp/capture/*.png
            /tmp/capture/*receipt.json
            /tmp/capture/wall-natural-proof.json
            /tmp/capture/wall-natural-contract.json
            /tmp/capture/*stdout.txt
            /tmp/capture/*stderr.txt
          if-no-files-found: error

