name: Capture genuine pinned v55 selected workforce cargo-preserving reassignment
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-native-v35.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Download and verify exact engine and deployed PCK
        run: |
          mkdir -p /tmp/capture
          curl -fL https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/engine.zip
          unzip /tmp/engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum -c -
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          curl -fL https://valley-crown-play.penny323tw.chatgpt.site/builds/vc-e4811bacee80/index.pck -o /tmp/capture/index.pck
          echo '7bf7b214de3ce10fb064af7df4b2b7053d119df356a62650dcadcacd96f0449f  /tmp/capture/index.pck' | sha256sum -c -
          cp ci/capture-v35.gd /tmp/capture/capture.gd
      - name: Resource guarded genuine native rendering with low-memory softpipe at bounded resolution
        run: python3 ci/capture-v35-guard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genuine-v55-reassign-native-render
          path: |
            /tmp/capture/*.png
            /tmp/capture/*receipt.json
            /tmp/capture/*stdout.txt
            /tmp/capture/*stderr.txt
          if-no-files-found: error
