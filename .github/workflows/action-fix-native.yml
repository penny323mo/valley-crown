name: Validate corrected native character runtime
on:
  push:
    branches: [ci/action-fix-native-v1]
    paths: ['.github/workflows/action-fix-native.yml', 'ci/**', '*.json', '*.zip']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify closed public CI inputs
        shell: bash
        run: |
          set -euo pipefail
          echo '6f4c13a4dd6ff629872ff374c29aece024ce764aa581fc1d8fe93e0039904c9c  ci/PUBLIC_INPUTS.sha256' | sha256sum --check --strict
          sha256sum --check --strict ci/PUBLIC_INPUTS.sha256
      - name: Fetch exact previously validated character artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13560214428'
          run-id: '42339730042'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: licensed-artifact
          merge-multiple: true
      - name: Assemble hash-bound ignored art and thin game source
        run: |
          set -euo pipefail
          python3 ci/assemble_combined.py
          python3 ci/apply_action_fix.py --project project --base-lock SOURCE_INPUT_LOCK.json --fix-lock ACTION_FIX_SOURCE_LOCK.json --overlay action-presentation-fix-v1.zip --receipt assembly-action-fix.json
      - name: Fetch pinned official Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir engine
          curl --fail --location --retry 2 -o engine/linux.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q engine/linux.zip -d engine
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  engine/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --check --strict
          chmod +x engine/Godot_v4.6.3-stable_linux.x86_64
      - name: Guard native packing reload stamping and playback
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/run_native_stage.py --project project --source-lock ACTION_FIX_SOURCE_LOCK.json --godot engine/Godot_v4.6.3-stable_linux.x86_64 --monitor ci/hardened_monitored_run.py --output native-evidence --private native-private --hosted-execution-approved
      - name: Scan and stage text evidence
        id: evidence_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '02b9126c8c02cf01ac983075ce171ee108f44391252908335ec1570d7e9a592b  ci/scan_native_evidence.py' | sha256sum --check --strict
          python3 ci/scan_native_evidence.py evidence
      - name: Preserve scanned text evidence
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: action-fix-native-evidence
          path: safe-native-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Scan and stage accepted runtime delta
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo '02b9126c8c02cf01ac983075ce171ee108f44391252908335ec1570d7e9a592b  ci/scan_native_evidence.py' | sha256sum --check --strict
          python3 ci/scan_native_evidence.py runtime
      - name: Preserve accepted native runtime delta
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: action-fix-native-runtime
          path: safe-native-runtime/
          if-no-files-found: error
          retention-days: 14
