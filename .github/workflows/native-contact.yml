name: Validate isolated native death equipment contact
on:
  push:
    branches: [ci/native-death-contact-v1]
    paths: ['.github/workflows/native-contact.yml', 'ci/**', '*.json']
permissions:
  contents: read
  actions: read
jobs:
  native-contact:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact reviewed public inputs
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          pins=json.loads(pathlib.Path('PUBLIC_INPUTS.json').read_text())
          for name,digest in pins.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          PYCODE
      - name: Fetch previously accepted licensed character artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13560214428'
          run-id: '42339730042'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: licensed-artifact
          merge-multiple: true
      - name: Fetch accepted native runtime delta
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13563191390'
          run-id: '42345297400'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-artifact
          merge-multiple: true
      - name: Reassemble exact accepted 181 files without a test overlay
        run: |
          set -euo pipefail
          python3 ci/assemble_combined.py
          python3 ci/apply_action_fix.py --project project --base-lock SOURCE_INPUT_LOCK.json --fix-lock ACTION_FIX_SOURCE_LOCK.json --overlay action-presentation-fix-v1.zip --receipt assembly-action-fix.json
          python3 ci/apply_native_delta.py
          python3 ci/apply_occlusion_overlay.py --project project --accepted-lock native-artifact/accepted-runtime/final-source-lock.json --package OCCLUSION_SOURCE_PACKAGE.json --package-sha256 52711be56c32b5f1a8b861ff4578843cebd3e16a1501b78466a5ac0492ad05aa --overlay occlusion-source-overlay-v3.zip --archive occlusion-source.zip --receipt assembly-occlusion.json
          python3 ci/apply_construction_overlay.py --project project --accepted-lock OCCLUSION_SOURCE_PACKAGE.json --package CONSTRUCTION_SOURCE_PACKAGE.json --package-sha256 069473af06b2519fb4fff01c774533e76ac07eb77d89b7d918064ad1e7f92bb4 --overlay construction-overlay.zip --archive construction-source.zip --receipt assembly-construction.json
      - name: Apply only reviewed ground shader and identity metadata
        run: |
          set -euo pipefail
          python3 ci/apply_ground_overlay.py --project project --base-package COMBINED_SOURCE_PACKAGE.json --package GROUND_SOURCE_PACKAGE.json --overlay ground-overlay.zip
          python3 - <<'PYCODE'
          import json,pathlib,sys
          sys.path.insert(0,'ci')
          from apply_construction_overlay import write_archive
          package=json.loads(pathlib.Path('GROUND_SOURCE_PACKAGE.json').read_text())
          entries={row['file']:row['sha256'] for row in package['files']}
          assert len(entries)==192
          write_archive(pathlib.Path('project'),entries,pathlib.Path('ground-source.zip'))
          PYCODE
      - name: Verify pinned official engine
        run: |
          set -euo pipefail
          mkdir engine
          curl --fail --location --retry 2 -o engine/linux.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q engine/linux.zip -d engine
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  engine/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --check --strict
          chmod +x engine/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Guarded import of exact accepted base
        run: |
          set -euo pipefail
          python3 ci/guarded_manifest_ci.py import --project project --godot "$GODOT" --archive ground-source.zip --manifest GROUND_SOURCE_PACKAGE.json --archive-sha256 cd9a1bf3c35130c591174b4600a336d3dcdc69a5bee6b91d327f4950912681f5 --manifest-sha256 51b142986a9563804f266887b3fe4718e892dd12ae67d919acd8250369cfb2ae --xdg private/import --hosted-execution-approved --output import-evidence
      - name: Guarded native patch and independent reload probe
        id: native
        run: python3 ci/run_native_contact.py
      - name: Admit bounded import evidence independently
        id: import_scan
        if: always()
        run: |
          set -euo pipefail
          echo 'd1581bec536849ad73d71c614c58820f25c397d8ac50be21772cd858342b189c  ci/scan_contact_evidence.py' | sha256sum --check --strict
          echo 'f2b6c6e68efcd03ee7029630894391225bd5e4cc78f7ec47eeb1a555318a5598  ci/run_native_contact.py' | sha256sum --check --strict
          echo '1737dfca2778614730b6dd6d3803009460139a19dfe901b830e84120abce75e0  ci/guarded_manifest_ci.py' | sha256sum --check --strict
          echo '4c7802bcfb53a2f73f501635cdf483e1459d3d86eb881a7450dccd3bbd705d50  ci/hardened_monitored_run.py' | sha256sum --check --strict
          echo '73269e158472ed138565b5a4be8fbc50ba08e30163b1a93747f3383a1fbf2082  ci/CONTACT_INPUTS.json' | sha256sum --check --strict
          python3 ci/scan_contact_evidence.py --import-only
      - name: Preserve admitted import receipts on success or failure
        if: always() && steps.import_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-contact-import-${{ github.sha }}-${{ github.run_attempt }}
          path: safe-import-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Admit only bounded privacy-scanned evidence
        id: scan
        if: always()
        run: |
          set -euo pipefail
          echo 'd1581bec536849ad73d71c614c58820f25c397d8ac50be21772cd858342b189c  ci/scan_contact_evidence.py' | sha256sum --check --strict
          echo 'f2b6c6e68efcd03ee7029630894391225bd5e4cc78f7ec47eeb1a555318a5598  ci/run_native_contact.py' | sha256sum --check --strict
          echo '1737dfca2778614730b6dd6d3803009460139a19dfe901b830e84120abce75e0  ci/guarded_manifest_ci.py' | sha256sum --check --strict
          echo '4c7802bcfb53a2f73f501635cdf483e1459d3d86eb881a7450dccd3bbd705d50  ci/hardened_monitored_run.py' | sha256sum --check --strict
          echo '73269e158472ed138565b5a4be8fbc50ba08e30163b1a93747f3383a1fbf2082  ci/CONTACT_INPUTS.json' | sha256sum --check --strict
          python3 ci/scan_contact_evidence.py
      - name: Preserve safe complete or failed evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-contact-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: safe-contact-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Retain validated native candidate outputs
        if: success() && steps.native.outcome == 'success' && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-contact-output-${{ github.sha }}-${{ github.run_attempt }}
          path: safe-contact-output/
          if-no-files-found: error
          retention-days: 14
