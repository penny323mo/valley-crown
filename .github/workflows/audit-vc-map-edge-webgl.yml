name: Prove exact Valley Crown map edge with Chromium WebGL2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-vc-map-edge-webgl.yml]
permissions:
  contents: read
  actions: read
jobs:
  webgl:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact formal artifacts and run stock WebGL2 renderer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          google-chrome --version
          timeout --kill-after=15s 540s python3 -B ci/map-edge-webgl/webgl-proof.py ci/map-edge-webgl/pins.json "$RUNNER_TEMP/vc-map-edge-webgl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vc-c57441a91f81-chromium-webgl2-map-edge
          path: ${{ runner.temp }}/vc-map-edge-webgl/
          retention-days: 30
          if-no-files-found: warn
