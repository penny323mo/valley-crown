name: Validate frozen integrated demo Web candidate
on:
  push:
    branches: [ci/demo-web-432766-v1]
    paths: ['.github/workflows/demo-web.yml', 'ci/**', '*.json', '*.zip']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reviewed public inputs
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          for name,digest in json.loads(pathlib.Path('PUBLIC_INPUTS.json').read_text()).items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          PYCODE
      - name: Fetch previously accepted licensed character artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13560214428'
          run-id: '42339730042'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: licensed-artifact
          merge-multiple: true
      - name: Fetch accepted native runtime delta
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13563191390'
          run-id: '42345297400'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-artifact
          merge-multiple: true
      - name: Reassemble exact accepted 181 files without a test overlay
        run: |
          set -euo pipefail
          python3 ci/assemble_combined.py
          python3 ci/apply_action_fix.py --project project --base-lock SOURCE_INPUT_LOCK.json --fix-lock ACTION_FIX_SOURCE_LOCK.json --overlay action-presentation-fix-v1.zip --receipt assembly-action-fix.json
          python3 ci/apply_native_delta.py
          python3 ci/apply_occlusion_overlay.py --project project --accepted-lock native-artifact/accepted-runtime/final-source-lock.json --package OCCLUSION_SOURCE_PACKAGE.json --package-sha256 52711be56c32b5f1a8b861ff4578843cebd3e16a1501b78466a5ac0492ad05aa --overlay occlusion-source-overlay-v3.zip --archive occlusion-source.zip --receipt assembly-occlusion.json
          python3 ci/apply_construction_overlay.py --project project --accepted-lock OCCLUSION_SOURCE_PACKAGE.json --package CONSTRUCTION_SOURCE_PACKAGE.json --package-sha256 069473af06b2519fb4fff01c774533e76ac07eb77d89b7d918064ad1e7f92bb4 --overlay construction-overlay.zip --archive construction-source.zip --receipt assembly-construction.json
      - name: Verify pinned official engine
        run: |
          set -euo pipefail
          mkdir engine
          curl --fail --location --retry 2 -o engine/linux.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q engine/linux.zip -d engine
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  engine/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --check --strict
          chmod +x engine/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Extract two identical fresh source copies
        run: |
          set -euo pipefail
          mkdir clean-a clean-b
          unzip -q construction-source.zip -d clean-a
          unzip -q construction-source.zip -d clean-b
      - name: Fetch pinned official no-thread Web template
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 -o engine/templates.tpz https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          unzip -p engine/templates.tpz templates/web_nothreads_release.zip > engine/web_nothreads_release.zip
          echo '1446f79dc12f60ce5d244c39fb6628ec298337ca5c4f91a16491feea72aa1bc9  engine/web_nothreads_release.zip' | sha256sum --check --strict
      - name: Guarded fresh source import a
        run: |
          python3 ci/guarded_manifest_ci.py import --project clean-a --godot "$GODOT" --archive construction-source.zip --manifest CONSTRUCTION_SOURCE_PACKAGE.json --archive-sha256 a4740d4e00862128d06dea1030dfd0efea6c9c0e8bc0e89f3a0396b5314d8f98 --manifest-sha256 069473af06b2519fb4fff01c774533e76ac07eb77d89b7d918064ad1e7f92bb4 --xdg cache/clean-a --hosted-execution-approved --output evidence/clean-a-import
      - name: Guarded fresh source import b
        run: |
          python3 ci/guarded_manifest_ci.py import --project clean-b --godot "$GODOT" --archive construction-source.zip --manifest CONSTRUCTION_SOURCE_PACKAGE.json --archive-sha256 a4740d4e00862128d06dea1030dfd0efea6c9c0e8bc0e89f3a0396b5314d8f98 --manifest-sha256 069473af06b2519fb4fff01c774533e76ac07eb77d89b7d918064ad1e7f92bb4 --xdg cache/clean-b --hosted-execution-approved --output evidence/clean-b-import
      - name: Guarded fresh Web export a
        run: |
          python3 ci/guarded_phone_artifacts.py export --project clean-a --godot "$GODOT" --archive construction-source.zip --output evidence/clean-a-export --xdg cache/clean-a --template engine/web_nothreads_release.zip --dest artifacts/clean-a --hosted-execution-approved
      - name: Guarded fresh Web export b
        run: |
          python3 ci/guarded_phone_artifacts.py export --project clean-b --godot "$GODOT" --archive construction-source.zip --output evidence/clean-b-export --xdg cache/clean-b --template engine/web_nothreads_release.zip --dest artifacts/clean-b --hosted-execution-approved
      - name: Compare independent exact Web payloads
        run: python3 ci/guarded_phone_artifacts.py compare --first evidence/clean-a-export --second evidence/clean-b-export --output evidence/export-comparison
      - name: Guarded source state reference
        run: python3 ci/guarded_phone_artifacts.py source-state --project clean-a --godot "$GODOT" --archive construction-source.zip --output evidence/source-state --xdg cache/clean-a --hosted-execution-approved
      - name: Guarded native packed validation a
        run: python3 ci/guarded_phone_artifacts.py packed --project clean-a --godot "$GODOT" --archive construction-source.zip --output evidence/pack-a --xdg cache/pack-a --export-evidence evidence/clean-a-export --source-state evidence/source-state/state.report.json --empty-project pack-root-a --hosted-execution-approved
      - name: Guarded native packed validation b
        run: python3 ci/guarded_phone_artifacts.py packed --project clean-b --godot "$GODOT" --archive construction-source.zip --output evidence/pack-b --xdg cache/pack-b --export-evidence evidence/clean-b-export --source-state evidence/source-state/state.report.json --empty-project pack-root-b --hosted-execution-approved
      - name: Admit only declared export and packed evidence
        id: evidence_scan
        if: ${{ !cancelled() }}
        run: |
          echo '82e4fd25a57a8f2ef13863a707096b0e1d8c02cad9a5e09083a3514ae7f79cdf  ci/scan_web_evidence.py' | sha256sum --check --strict
          python3 ci/scan_web_evidence.py
      - name: Retain independently admitted evidence
        if: ${{ !cancelled() && steps.evidence_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: demo-web-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/
            evidence-scan.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain only fully validated candidate payload and notices
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: demo-web-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/
            CANDIDATE_NOTICES.txt
            clean-a/GODOT-LICENSES.txt
            clean-a/assets/fonts/NOTO-LICENSE.txt
            clean-a/assets/fonts/DEJAVU-LICENSE.txt
            clean-a/art/action_characters/licenses/*.txt
          if-no-files-found: error
          retention-days: 14
