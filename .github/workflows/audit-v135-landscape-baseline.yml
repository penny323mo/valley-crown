name: Audit v135 baseline short landscape field with exact browser input
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-v135-landscape-baseline.yml]
permissions:
  contents: read
  actions: read
jobs:
  browser:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact real product archive and isolate browser files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '29a4b6fd8df8294724dc8f60d3fcb17870b1fefe177a0e5c9dd0331fb6d19247  ci/audit-v135-landscape-browser.py' | sha256sum --strict -c
          google-chrome --version
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,re,sys
          sys.path.insert(0,'scripts')
          from web_release_archive import GitHub,verified_members
          row={'artifact_id': 14562197426, 'run_id': 44584806093, 'build': 'vc-ea0e9d130c01', 'metadata_sha256': '74feac342f06eda0386f499789ce30e2b8f2b9ff8dac8ac433dd4cce3457e4fa', 'zip_sha256': 'fe0835768fbe3f70fa6582c68a4074e0f3473d4de7a16223ec6250ce998857a3'}
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']=='244dbadc2648a59d126caa31ca34666cef9319b7'
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          data=g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True)
          members=verified_members(data,row)
          identity=json.loads(members['candidate-metadata.json'])
          assert identity['source_commit']=='3cd3b3ea0da6cdea5ef88b7f87782b9585c46fb7' and identity['game_tree']=='90ac49bdd1fe1b9ac69f94aeb181ce2a8280c984'
          dest=pathlib.Path('/tmp/v133-browser-proof');dest.mkdir()
          for path,data in members.items():
              if path.startswith('artifacts/clean-a/'):
                  name=path.split('/')[-1]
                  assert name.startswith('index.')
                  (dest/name).write_bytes(data)
          (dest/'probe.html').write_text('<!doctype html><title>local disposable browser proof</title>')
          (dest/'input.json').write_text(json.dumps(row))
          PY
      - name: Run real Web export with ordinary campaign, compact command, paid build and rotate
        run: python3 -B ci/audit-v135-landscape-browser.py /tmp/v133-browser-proof baseline vc-ea0e9d130c01
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v135-landscape-baseline-proof
          path: |
            /tmp/v133-browser-proof/input.json
            /tmp/v133-browser-proof/browser-proof.json
            /tmp/v133-browser-proof/chromedriver.log
            /tmp/v133-browser-proof/browser-console.json
            /tmp/v133-browser-proof/*-actual-battle.png
          retention-days: 15
          if-no-files-found: error
