name: Compare surface-cut mineral vein art in exact game
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-ore-surface-prototype.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Bind official engine, exact artifact bytes and reviewed capture tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '139f4ef890cf378fa64e386bd0676ee9ad8d617ff4d43a7d738380386e179cbf  ci/capture-ore-surface-prototype.gd' | sha256sum --strict -c
          echo '61cb64f9dfaa1a6aee1ca288435b1eb8b6349e3ae2a2d52b00c9a67962a05355  ci/capture-ore-surface-prototype-guard.py' | sha256sum --strict -c
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/v137-engine.zip
          unzip -q /tmp/v137-engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --strict -c
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path[:0]=['scripts']
          from web_release_archive import GitHub,verified_members
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          row,workflow_head,source,tree=({'artifact_id': 14575186995, 'run_id': 44613205661, 'build': 'vc-98a66fc81dbe', 'metadata_sha256': 'ceea5dac9897dcdafc5f6ef06272c64e5300ba3d35b38da2708e321ea74ebd3c', 'zip_sha256': '1eddf11cf1cac5d61be4884ae0ae9e1936eb7f34d09905a9570a1a03539bf64b'}, '6489fd64b1fc7d8fe2818e0afb188173e8b4320c', '420a7c3d3769a33f4a929577122efd4ed2d10db3', 'ba9e44ecf1f97db5c148e2e1934c206ef8023a18')
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']==workflow_head
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          files=verified_members(g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True),row)
          m=json.loads(files['candidate-metadata.json'])
          assert m['source_commit']==source and m['game_tree']==tree
          pck=files['artifacts/clean-a/index.pck']
          assert pck==files['artifacts/clean-b/index.pck']
          path=pathlib.Path('/tmp/v138-ore-study');path.mkdir()
          (path/'index.pck').write_bytes(pck)
          (path/'capture.gd').write_bytes(pathlib.Path('ci/capture-ore-surface-prototype.gd').read_bytes())
          patch=pathlib.Path('ci/ore-surface-prototype.gd').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='48d35c3eb121e4be4a9a746bb64434dbdeaf8ab0557632a7df7236135a00f4fd'
          (path/'ore-surface.gd').write_bytes(patch)
          (path/'input.json').write_text(json.dumps({'source_commit':source,'game_tree':tree,'build':row['build'],'pck_sha256':hashlib.sha256(pck).hexdigest()}))
          PY
      - name: Captures of same exact game with only a presentation overlay
        run: python3 -B ci/capture-ore-surface-prototype-guard.py /tmp/v138-ore-study vc-98a66fc81dbe 390 844 prototype
      - name: Validate this is a genuine rendered local prototype, not a release
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/v138-ore-study')
          pr=json.loads((p/'images/report.json').read_text())
          gr=json.loads((p/'native-render-receipt.json').read_text())
          assert all(t['passed'] for t in pr['checks'])
          assert gr['returncode']==0 and gr['live_process_group_gone'] and gr['after']['oom']==gr['baseline']['oom']
          assert pr['build']=='vc-98a66fc81dbe' and pr['camera']=={'focus':[-25,0,24],'zoom':30}
          assert len(pr['ore'])==4 and pr['center_probe_counts']['iron']>=3 and pr['center_probe_counts']['stone']>=1
          assert not pr['lost_edge_hits'] and len(pr['checks'])==8
          assert set(pr['images'])=={'home-before','home-prototype'}
          for name,info in pr['images'].items():
              raw=(p/'images'/(name+'.png')).read_bytes()
              assert (info['width'],info['height'])==(390,844)
              assert hashlib.sha256(raw).hexdigest()==info['sha256'] and raw[:8]==bytes.fromhex('89504e470d0a1a0a')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v138-ore-study-390x844
          path: |
            /tmp/v138-ore-study/input.json
            /tmp/v138-ore-study/images/*.png
            /tmp/v138-ore-study/images/report.json
            /tmp/v138-ore-study/native-render-*.json
            /tmp/v138-ore-study/native-render-*.txt
          retention-days: 30
          if-no-files-found: error
