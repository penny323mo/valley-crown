name: Validate frozen phone candidate
on:
  push:
    branches: ['ci/phone-vc-8fcc302051f0']
    paths: ['valley-crown-mobile-source-vc-8fcc302051f0-ci.zip', '.github/workflows/phone-ci.yml', 'ci/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record runner resource preflight
        shell: bash
        run: |
          mkdir -p evidence
          { uname -a; free -h; df -h .; nproc; } | tee evidence/runner-resources.log
      - name: Verify and extract reviewed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence source engine
          echo '92e660f43172fb731574a5b9f40ff9059cfd036b27845d226b3bd804849c564e  valley-crown-mobile-source-vc-8fcc302051f0-ci.zip' | sha256sum --check --strict
          unzip -q valley-crown-mobile-source-vc-8fcc302051f0-ci.zip -d source
      - name: Install pinned official engine
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 -o engine/linux.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q engine/linux.zip -d engine
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  engine/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --check --strict
          chmod +x engine/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Guarded import of frozen source
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/guarded_phone_ci.py import --project source --godot "$GODOT" --archive valley-crown-mobile-source-vc-8fcc302051f0-ci.zip --output evidence/source-import --xdg cache/source
      - name: Guarded eight portable suites
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/guarded_phone_ci.py test --project source --godot "$GODOT" --archive valley-crown-mobile-source-vc-8fcc302051f0-ci.zip --output evidence/source-tests --xdg cache/source
      - name: Retain initial test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-candidate-vc-8fcc302051f0-${{ github.run_attempt }}
          path: |
            evidence/
          if-no-files-found: error
          retention-days: 14
