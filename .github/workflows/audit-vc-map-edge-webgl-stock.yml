name: Prove Valley Crown stock Survival west edge in Chromium WebGL2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-vc-map-edge-webgl-stock.yml]
permissions:
  contents: read
  actions: read
jobs:
  webgl-stock:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact formal ZIPs and route ordinary Survival through stock Chromium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'd2d2642d3034e9ba53b59b3392f8ec0c7688c670c6e4214e0c0fa99d8e61d838  ci/map-edge-webgl-stock/stock-proof.py' | sha256sum --strict --check
          echo '073dbf3ac926c3eeedc551e64c9e2d0be869eecfadc10fba7f387e5e57ecfd5c  ci/map-edge-webgl-stock/pins.json' | sha256sum --strict --check
          google-chrome --version
          timeout --kill-after=15s 650s python3 -B ci/map-edge-webgl-stock/stock-proof.py ci/map-edge-webgl-stock/pins.json "$RUNNER_TEMP/vc-map-edge-stock"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vc-c57441a91f81-stock-survival-chromium-webgl2-settled-menu
          path: ${{ runner.temp }}/vc-map-edge-stock/
          retention-days: 30
          if-no-files-found: warn
