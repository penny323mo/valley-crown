name: Capture exact v137 outpost preview baseline
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-v137-outpost-baseline.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Bind official engine, exact artifact bytes and reviewed capture tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '5d5a667fe73af67726298e1def9436bdfd874381dcc7ce2aeb541ff4b1f6d907  ci/capture-v137-outpost.gd' | sha256sum --strict -c
          echo '61cb64f9dfaa1a6aee1ca288435b1eb8b6349e3ae2a2d52b00c9a67962a05355  ci/capture-v137-outpost-guard.py' | sha256sum --strict -c
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/v137-engine.zip
          unzip -q /tmp/v137-engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --strict -c
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path[:0]=['scripts']
          from web_release_archive import GitHub,verified_members
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          row,workflow_head,source,tree=({'artifact_id': 14572247534, 'run_id': 44605756697, 'build': 'vc-037b3db3b754', 'metadata_sha256': '4fddd4e37b8453f48097e8435b085ba2b95ecba5b92ac803f8b91af898955490', 'zip_sha256': 'e07012756a686b6c04d889866302953c431a6bf74017318a92909d3acc617e5d'}, '1f5c26fa1a067da4bded5a39c57bb13c4943eb93', '10bc1ffef4f4715e294b2ae82a8ae966448c0fab', '317d215e916239bbc25caf73156fc8291b59a6ca')
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']==workflow_head
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          files=verified_members(g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True),row)
          m=json.loads(files['candidate-metadata.json'])
          assert m['source_commit']==source and m['game_tree']==tree
          pck=files['artifacts/clean-a/index.pck']
          assert pck==files['artifacts/clean-b/index.pck']
          path=pathlib.Path('/tmp/v137-outpost-capture');path.mkdir()
          (path/'index.pck').write_bytes(pck)
          (path/'capture.gd').write_bytes(pathlib.Path('ci/capture-v137-outpost.gd').read_bytes())
          (path/'input.json').write_text(json.dumps({'source_commit':source,'game_tree':tree,'build':row['build'],'pck_sha256':hashlib.sha256(pck).hexdigest()}))
          PY
      - name: Run bounded real engine with ordinary outpost preview and construction
        run: python3 -B ci/capture-v137-outpost-guard.py /tmp/v137-outpost-capture vc-037b3db3b754 390 844 baseline
      - name: Verify original real-game PNGs, actual ordinary spend and exact product identity
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/v137-outpost-capture')
          d=json.loads((p/'images/report.json').read_text())
          run=json.loads((p/'native-render-receipt.json').read_text())
          info=json.loads((p/'input.json').read_text())
          assert d['pass'] and d['visual_checks'] and all(x['passed'] for x in d['visual_checks'])
          assert d['build']=='vc-037b3db3b754'==info['build'] and d['audit'] and d['visual_only'] and d['paid_preview']
          assert run['returncode']==0 and run['live_process_group_gone'] and run['stop_reason'] is None
          assert run['inputs']['index.pck']==info['pck_sha256'] and run['after']['oom']==run['baseline']['oom']
          assert d['stage_ticks']==[359] and d['ticks']==401 and not d['finished']
          assert set(d['images'])=={'outside-preview'}
          for name,row in d['images'].items():
              dimensions=(390,844)
              assert (row['width'],row['height'])==dimensions
              data=(p/'images'/(name+'.png')).read_bytes()
              assert data.startswith(bytes.fromhex('89504e470d0a1a0a')) and hashlib.sha256(data).hexdigest()==row['sha256']
              assert data[12:16]==b'IHDR' and (int.from_bytes(data[16:20],'big'),int.from_bytes(data[20:24],'big'))==dimensions
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v137-outpost-baseline-390x844
          path: |
            /tmp/v137-outpost-capture/input.json
            /tmp/v137-outpost-capture/images/*.png
            /tmp/v137-outpost-capture/images/report.json
            /tmp/v137-outpost-capture/native-render-*.json
            /tmp/v137-outpost-capture/native-render-*.txt
          retention-days: 30
          if-no-files-found: error
