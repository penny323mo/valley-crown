# Controlled current-product export; user requested release 2026-11-13. Tool review applies to publication.
# PREPARED ONLY: mechanical source pin and explicit reviewed gate required.
name: Validate building runtime and package separate Web candidates
on:
  push:
    branches: [main]
    paths: ["ci/SUPPORT_SHA256SUMS", ".github/workflows/building-runtime.yml"]
permissions:
  contents: read
concurrency:
  group: building-runtime-vc-be8c3c2f8ca5
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BUILDING_RUNTIME_SOURCE_COMMIT: 72f7beadd3a822e88edbb1754542735b552c4538
      BUILDING_RUNTIME_EXECUTION_APPROVED: 'true'
    steps:
      - name: Reject pending or unapproved pins
        run: |
          set -euo pipefail
          test "$BUILDING_RUNTIME_EXECUTION_APPROVED" = true
          test "$GITHUB_REPOSITORY" = penny323mo/valley-crown
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$BUILDING_RUNTIME_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - name: Select separate fresh runner workspace
        run: echo "RTS_WORK=$RUNNER_TEMP/building-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Fetch exact frozen source independently of support history
        run: git fetch --no-tags --depth=1 origin "$BUILDING_RUNTIME_SOURCE_COMMIT"
      - name: Shell-only support identity check before importing Python
        run: |
          set -euo pipefail
          echo '80b2efb22375e65728fc3ebe45590ad10d6a88c3d654bb99914c8a4c65143208  ci/SUPPORT_SHA256SUMS' | sha256sum --strict --check
          sha256sum --strict --check ci/SUPPORT_SHA256SUMS
          test ! -e "$RTS_WORK"
          mkdir -m 700 "$RTS_WORK"
      - name: Freeze both exact sources before any engine use
        run: |
          set -euo pipefail
          python3 -B ci/prepare_web_release.py prepare --side product --work "$RTS_WORK/product"
      - name: Pure original and building adapter preflight
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s ci -p test_contracts.py -v 2>&1 | tee "$RTS_WORK/preflight-contracts.log"
          python3 -B -m unittest discover -s ci -p test_military.py -v 2>&1 | tee "$RTS_WORK/preflight-military.log"
          python3 -B -m unittest discover -s ci -p test_faction.py -v 2>&1 | tee "$RTS_WORK/preflight-faction.log"
          python3 -B -m unittest discover -s ci -p test_building_contracts.py -v 2>&1 | tee "$RTS_WORK/preflight-building.log"
          python3 -B -m unittest discover -s ci -p test_runtime_package.py -v 2>&1 | tee "$RTS_WORK/preflight-package.log"
      - name: Pure source preparation tests and exact lock preflight
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s ci -p test_prepare_building_stage.py -v 2>&1 | tee "$RTS_WORK/preflight-prepare.log"
          python3 -B ci/preflight_runtime_lock.py --side product --work "$RTS_WORK/product" 2>&1 | tee "$RTS_WORK/preflight-product-lock.log"
      - name: Prepare pinned official engine and template without launch
        run: |
          set -euo pipefail
          python3 -B ci/prepare_web_release.py engine --side product --work "$RTS_WORK/product"
          python3 -B ci/prepare_web_templates.py --work "$RTS_WORK/product"
      - name: Fresh guarded product import
        run: |
          set -euo pipefail
          source "$RTS_WORK/product/pins.env"
          python3 -B ci/guarded_manifest_ci.py import --project "$RTS_WORK/product/project" --godot "$RTS_WORK/product/engine/Godot_v4.6.3-stable_linux.x86_64" --archive "$RTS_WORK/product/source.zip" --manifest "$RTS_WORK/product/import-manifest.json" --archive-sha256 "$ARCHIVE_SHA" --manifest-sha256 "$MANIFEST_SHA" --output "$RTS_WORK/product/import-evidence" --xdg "$RTS_WORK/product/private/import" --hosted-execution-approved
      - name: Six exact building suites first
        run: |
          set -euo pipefail
          python3 -B ci/run_building_contracts.py --project "$RTS_WORK/product/project" --godot "$RTS_WORK/product/engine/Godot_v4.6.3-stable_linux.x86_64" --lock "$RTS_WORK/product/export-lock.json" --import-marker "$RTS_WORK/product/private/import/import-complete.json" --output "$RTS_WORK/product/building-contracts" --private "$RTS_WORK/product/private/building-contracts"
      - name: Eight original release suites
        run: |
          set -euo pipefail
          python3 -B ci/run_contracts.py --project "$RTS_WORK/product/project" --godot "$RTS_WORK/product/engine/Godot_v4.6.3-stable_linux.x86_64" --lock "$RTS_WORK/product/export-lock.json" --import-marker "$RTS_WORK/product/private/import/import-complete.json" --output "$RTS_WORK/product/construction-contracts" --private "$RTS_WORK/product/private/construction-contracts"
      - name: Two original military suites
        run: |
          set -euo pipefail
          python3 -B ci/run_military.py --project "$RTS_WORK/product/project" --godot "$RTS_WORK/product/engine/Godot_v4.6.3-stable_linux.x86_64" --lock "$RTS_WORK/product/export-lock.json" --import-marker "$RTS_WORK/product/private/import/import-complete.json" --output "$RTS_WORK/product/military-contracts" --private "$RTS_WORK/product/private/military-contracts"
      - name: Original faction publication suite
        run: |
          set -euo pipefail
          python3 -B ci/run_faction.py --project "$RTS_WORK/product/project" --godot "$RTS_WORK/product/engine/Godot_v4.6.3-stable_linux.x86_64" --lock "$RTS_WORK/product/export-lock.json" --import-marker "$RTS_WORK/product/private/import/import-complete.json" --output "$RTS_WORK/product/faction-contracts" --private "$RTS_WORK/product/private/faction-contracts"
      - name: Latest material and paid production contracts
        run: |
          set -euo pipefail
          python3 -B ci/run_latest_contracts.py --project "$RTS_WORK/product/project" --godot "$RTS_WORK/product/engine/Godot_v4.6.3-stable_linux.x86_64" --lock "$RTS_WORK/product/export-lock.json" --import-marker "$RTS_WORK/product/private/import/import-complete.json" --output "$RTS_WORK/product/latest-contracts" --private "$RTS_WORK/product/private/latest-contracts"
      - name: Two original guarded product exports
        run: |
          set -euo pipefail
          python3 -B ci/run_export.py --project "$RTS_WORK/product/project" --godot "$RTS_WORK/product/engine/Godot_v4.6.3-stable_linux.x86_64" --template "$RTS_WORK/product/template/web_nothreads_release.zip" --lock "$RTS_WORK/product/export-lock.json" --import-marker "$RTS_WORK/product/private/import/import-complete.json" --output "$RTS_WORK/product/exports" --private "$RTS_WORK/product/private/export"
      - name: Package product only after all actual suite receipts pass
        run: |
          set -euo pipefail
          python3 -B ci/package_web_release.py --side product --work "$RTS_WORK/product"
      - name: Upload verified product candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: building-product-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.RTS_WORK }}/product/candidate/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
      - name: Always retain explicit actual bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: building-runtime-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.RTS_WORK }}/preflight-prepare.log
            ${{ env.RTS_WORK }}/preflight-product-lock.log
