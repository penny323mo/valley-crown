name: Author fixed public unit grips
on:
  push:
    branches: ['ci/grip-authoring-1887746-20261111']
permissions:
  contents: read
concurrency:
  group: blender-grip-authoring-${{ github.ref }}
  cancel-in-progress: false
jobs:
  author:
    if: github.ref == 'refs/heads/ci/grip-authoring-1887746-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact reviewed dispatched revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1887746368a6208d1ad6ef58d9798a3fbd7ec973
          persist-credentials: false
          fetch-depth: 1
      - name: Admit exact helpers and stage fixed public inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,os,sys
          from pathlib import Path
          root=Path('ci/blender-grip-authoring').resolve()
          admission=json.loads((root/'derivation-admission.json').read_text())
          assert admission['reviewed_for_derivation'] is True
          for name,digest in admission['files'].items():
              path=root/name
              assert path.parent==root and path.is_file() and not path.is_symlink()
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          sys.path.insert(0,str(root))
          import derive_authoring_lock as d
          d.validate_admission(admission)
          target=Path(os.environ['RUNNER_TEMP'])/'grip-authoring'
          assert not target.exists();target.mkdir(mode=0o700)
          for group in ('code','source','calibration'): (target/group).mkdir(mode=0o700)
          for name,h in d.CODE.items():
              source=d.r.checked(Path('art/grip_correction')/name,h,1<<20)
              (target/'code'/name).write_bytes(source.read_bytes())
          for name,h in d.r.SOURCE_FILES.items():
              source=d.r.checked(Path('game/art/action_characters')/name,h,16<<20)
              (target/'source'/name).write_bytes(source.read_bytes())
          source=d.r.checked('art/grip_correction/product-grip-calibration.json',d.CALIBRATION,16<<20)
          (target/'calibration/product-grip-calibration.json').write_bytes(source.read_bytes())
          PY
      - name: Download only the fixed official archive
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5 120 python3 ci/blender-grip-authoring/download_official_archive.py --destination "$RUNNER_TEMP/grip-authoring/download"
      - name: Derive verified tool inventory and frozen lock
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5 120 python3 ci/blender-grip-authoring/derive_authoring_lock.py --admission ci/blender-grip-authoring/derivation-admission.json --archive "$RUNNER_TEMP/grip-authoring/download/blender-4.3.2-linux-x64.tar.xz" --code-root "$RUNNER_TEMP/grip-authoring/code" --input-root "$RUNNER_TEMP/grip-authoring/source" --calibration "$RUNNER_TEMP/grip-authoring/calibration/product-grip-calibration.json" --tool-root "$RUNNER_TEMP/grip-authoring/tool" --extraction-receipt "$RUNNER_TEMP/grip-authoring/extraction-receipt.json" --lock "$RUNNER_TEMP/grip-authoring/authoring-lock.json"
      - name: Author four fixed kinds under unchanged guard
        run: |
          set -euo pipefail
          python3 ci/blender-grip-authoring/run_authoring.py --lock "$RUNNER_TEMP/grip-authoring/authoring-lock.json" --archive "$RUNNER_TEMP/grip-authoring/download/blender-4.3.2-linux-x64.tar.xz" --extraction-receipt "$RUNNER_TEMP/grip-authoring/extraction-receipt.json" --tool-root "$RUNNER_TEMP/grip-authoring/tool" --code-root "$RUNNER_TEMP/grip-authoring/code" --input-root "$RUNNER_TEMP/grip-authoring/source" --calibration "$RUNNER_TEMP/grip-authoring/calibration/product-grip-calibration.json" --output-root "$RUNNER_TEMP/grip-authoring/output" --evidence-root "$RUNNER_TEMP/grip-authoring/evidence"
      - name: Upload only successful candidate products
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-grip-candidates-${{ github.run_id }}
          path: ${{ runner.temp }}/grip-authoring/output/
          if-no-files-found: error
          retention-days: 7
      - name: Upload identity and guard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-grip-guard-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/grip-authoring/download/download-receipt.json
            ${{ runner.temp }}/grip-authoring/download/blender-4.3.2.sha256
            ${{ runner.temp }}/grip-authoring/extraction-receipt.json
            ${{ runner.temp }}/grip-authoring/authoring-lock.json
            ${{ runner.temp }}/grip-authoring/evidence/authoring-receipt.json
            ${{ runner.temp }}/grip-authoring/evidence/*/receipt.json
            ${{ runner.temp }}/grip-authoring/evidence/*/blender.log
          if-no-files-found: warn
          retention-days: 7
