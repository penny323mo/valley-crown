name: Audit public Valley Crown Web checkpoint recovery
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-public-checkpoint-web.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordinary-manual-checkpoint:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Save in Recon, reject in Quiet, restore in Recon with terminal diagnostics
        run: python3 -B ci/public-checkpoint-web/checkpoint-proof.py "$RUNNER_TEMP/vc-checkpoint-proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: valley-crown-public-web-checkpoint
          path: ${{ runner.temp }}/vc-checkpoint-proof/
          retention-days: 7
          if-no-files-found: warn
