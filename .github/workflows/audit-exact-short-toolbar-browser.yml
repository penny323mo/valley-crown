name: Audit exact stock 480×270 Standard toolbar in Chromium
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-exact-short-toolbar-browser.yml]
permissions:
  contents: read
  actions: read
jobs:
  stock-toolbar:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact Standard exports, touch the visible Menu, Idle and Pause controls at 480x270
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '7d697a5cae9d4d323e76df05a7825d83761f56d832256e023b40dfbbc5de7a55  ci/short-toolbar-web/topbar-proof.py' | sha256sum --strict --check
          echo '75ed894f850c0cad308d3addcd54e318fdce05fca33ddb1391c93772e4896006  ci/short-toolbar-web/pins.json' | sha256sum --strict --check
          echo '07ef064054d6d1a66ceb8c01de2cf8a84d67abc3a756533ca7e47bf36d16c740  ci/map-edge-webgl-stock/stock-proof.py' | sha256sum --strict --check
          echo 'ede588f6ee877b5af8f35880d463d39d37065c92740c6f958443e10f6aceb5ad  ci/map-edge-webgl-stock/gl-observe.js' | sha256sum --strict --check
          google-chrome --version
          timeout --kill-after=15s 385s python3 -B ci/short-toolbar-web/topbar-proof.py ci/short-toolbar-web/pins.json "$RUNNER_TEMP/vc-short-toolbar-web"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vc-2bf736f4bf15-stock-toolbar-chromium-480
          path: ${{ runner.temp }}/vc-short-toolbar-web/
          retention-days: 30
          if-no-files-found: warn
