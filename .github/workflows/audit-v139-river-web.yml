name: Audit exact Double Crossing Valley mobile Web picker and launch
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-v139-river-web.yml]
permissions:
  contents: read
  actions: read
jobs:
  browser:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact real product archive and isolate browser files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '9a4c6dcce550f47d413b400bb8bb6660c9391870458ed8f0bedb9d172f8287e9  ci/audit-v139-river-web.py' | sha256sum --strict -c
          google-chrome --version
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,re,sys
          sys.path.insert(0,'scripts')
          from web_release_archive import GitHub,verified_members
          row={'artifact_id': 14588880894, 'run_id': 44642506940, 'build': 'vc-b93dd669a7ce', 'metadata_sha256': '34dceae9253a5c1f23b7faf20cdd41f0fed8965eb692cf262569274bba8f3b6b', 'zip_sha256': 'a1db24e208013e8718533ddeafc1648236e371f1a8574ab56e2976ce33aa0426'}
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']=='9f432fb7869fcea28925e2411decf6f37788136d'
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          data=g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True)
          members=verified_members(data,row)
          identity=json.loads(members['candidate-metadata.json'])
          assert identity['source_commit']=='e2beeda5af306e3e18ba7983e72c2c524815ffb2' and identity['game_tree']=='10cd03224304d312693302b7417ba02e08763462'
          dest=pathlib.Path('/tmp/v133-browser-proof');dest.mkdir()
          for path,data in members.items():
              if path.startswith('artifacts/clean-a/'):
                  name=path.split('/')[-1]
                  assert name.startswith('index.')
                  (dest/name).write_bytes(data)
          (dest/'probe.html').write_text('<!doctype html><title>local disposable browser proof</title>')
          (dest/'input.json').write_text(json.dumps(row))
          PY
      - name: Run exact Web picker, ordinary touch movement and viewport rotation
        run: python3 -B ci/audit-v139-river-web.py /tmp/v133-browser-proof candidate vc-b93dd669a7ce
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v139-exact-river-web-proof
          path: |
            /tmp/v133-browser-proof/input.json
            /tmp/v133-browser-proof/browser-proof.json
            /tmp/v133-browser-proof/chromedriver.log
            /tmp/v133-browser-proof/browser-console.json
            /tmp/v133-browser-proof/*-actual-battle.png
          retention-days: 15
          if-no-files-found: error
