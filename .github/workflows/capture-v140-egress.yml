name: Capture exact before and after newly trained units at the same crowded barracks
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-v140-egress.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {role: baseline}
          - {role: candidate}
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Bind official engine, exact artifact bytes and reviewed capture tools
        env:
          ROLE: ${{ matrix.role }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'dd2f51eece6c504ededa7c8b24a9cdb2e7b7b6385b2286c8d1c8dbbd34bb4ac1  ci/capture-v140-egress.gd' | sha256sum --strict -c
          echo '61cb64f9dfaa1a6aee1ca288435b1eb8b6349e3ae2a2d52b00c9a67962a05355  ci/capture-v140-egress-guard.py' | sha256sum --strict -c
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/v137-engine.zip
          unzip -q /tmp/v137-engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --strict -c
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path[:0]=['scripts']
          from web_release_archive import GitHub,verified_members
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          role=os.environ["ROLE"]
          row,workflow_head,source,tree={'baseline': ({'artifact_id': 14588880894, 'run_id': 44642506940, 'build': 'vc-b93dd669a7ce', 'metadata_sha256': '34dceae9253a5c1f23b7faf20cdd41f0fed8965eb692cf262569274bba8f3b6b', 'zip_sha256': 'a1db24e208013e8718533ddeafc1648236e371f1a8574ab56e2976ce33aa0426'}, '9f432fb7869fcea28925e2411decf6f37788136d', 'e2beeda5af306e3e18ba7983e72c2c524815ffb2', '10cd03224304d312693302b7417ba02e08763462'), 'candidate': ({'artifact_id': 14591161497, 'run_id': 44647332444, 'build': 'vc-f8e5d36dd70d', 'metadata_sha256': 'da5e338cfb7f96f243d885bc8dd3b520cc174d207f20d5b32e684e1716e1de8c', 'zip_sha256': '39afc3aecc11824f14af4e33238f2fff8ebe9e4aee5198181e37bbd0cb9b50b0'}, 'f002d8549c915502a1f8db0dbf2020a0c6bb2b62', '915f1e073e73a2d16e1d237e354f064b40c3911d', '38793dd9ad11fe053cbf2c15675b96d3216c2c81')}[role]
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']==workflow_head
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          files=verified_members(g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True),row)
          m=json.loads(files['candidate-metadata.json'])
          assert m['source_commit']==source and m['game_tree']==tree
          pck=files['artifacts/clean-a/index.pck']
          assert pck==files['artifacts/clean-b/index.pck']
          path=pathlib.Path('/tmp/v140-egress');path.mkdir()
          (path/'index.pck').write_bytes(pck)
          (path/'capture.gd').write_bytes(pathlib.Path('ci/capture-v140-egress.gd').read_bytes())
          (path/'input.json').write_text(json.dumps({'source_commit':source,'game_tree':tree,'build':row['build'],'pck_sha256':hashlib.sha256(pck).hexdigest(),'role':role}))
          PY

      - name: Actual funded Classic placement, paid training and real native rendering 
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          BUILD="$(python3 -c 'import json; print(json.load(open("/tmp/v140-egress/input.json"))["build"])')"
          python3 -B ci/capture-v140-egress-guard.py /tmp/v140-egress "$BUILD" 390 844 "$ROLE"
      - name: Check real scenario results, ledger, process cleanup and PNG hashes
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('/tmp/v140-egress'); i=json.loads((d/'input.json').read_text()); j=json.loads((d/'images/report.json').read_text()); g=json.loads((d/'native-render-receipt.json').read_text())
          candidate=i['role']=='candidate'
          assert j['build']==i['build'] and j['corrected']==candidate and j['layout']=='valley' and j['size']==[390,844]
          assert j['failed']==0 and j['ledger'] and len(j['checks'])==(21 if candidate else 20) and all(c['passed'] for c in j['checks'])
          assert j['older']['before']==5601 and j['older']['after']==7
          assert j['newer']['cells']==(5591 if candidate else 7) and j['newer']['birth']==('(-23.5, 0.0, 27.5)' if candidate else '(-27.5, 0.0, 28.5)')
          assert g['returncode']==0 and g['stop_reason'] is None and g['live_process_group_gone'] and g['inputs']['index.pck']==i['pck_sha256'] and g['after']['oom']==g['baseline']['oom']
          p=(d/'images/production-egress.png').read_bytes()
          assert p[:8]==bytes.fromhex('89504e470d0a1a0a') and hashlib.sha256(p).hexdigest()==j['images']['production-egress']['sha256']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v140-exact-egress-${{ matrix.role }}
          path: |
            /tmp/v140-egress/input.json
            /tmp/v140-egress/native-render-*
            /tmp/v140-egress/images/*.png
            /tmp/v140-egress/images/report.json
          retention-days: 30
          if-no-files-found: error
