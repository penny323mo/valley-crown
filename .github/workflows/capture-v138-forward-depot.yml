name: Capture genuine exact Frontline Depot journey and victory
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-v138-forward-depot.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Bind official engine, exact artifact bytes and reviewed capture tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '6725e31df943ce37fdb26afeecf472638b81f9f33ab673b751ae616adaf50939  ci/capture-v138-forward-depot.gd' | sha256sum --strict -c
          echo '61cb64f9dfaa1a6aee1ca288435b1eb8b6349e3ae2a2d52b00c9a67962a05355  ci/capture-v138-forward-depot-guard.py' | sha256sum --strict -c
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/v137-engine.zip
          unzip -q /tmp/v137-engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --strict -c
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path[:0]=['scripts']
          from web_release_archive import GitHub,verified_members
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          row,workflow_head,source,tree=({'artifact_id': 14580174918, 'run_id': 44626413569, 'build': 'vc-ce2efc75244b', 'metadata_sha256': '3dd5ebf42f693b612b3843f8ef9c4eed43b4722d3d03d843080f12f80fa406b9', 'zip_sha256': '7cd2eec672926e643d8885f4903fb6f050cfd450db55dd4e7990bd84ed693397'}, 'e9e51f952bc156f43f1880ee12da53428f1f4b68', '521dfb8b65191c8b4a0c8452272bdc46bdeaa06a', 'a16eb9691c6a592fa41e720ea149f71377257c0b')
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']==workflow_head
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          files=verified_members(g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True),row)
          m=json.loads(files['candidate-metadata.json'])
          assert m['source_commit']==source and m['game_tree']==tree
          pck=files['artifacts/clean-a/index.pck']
          assert pck==files['artifacts/clean-b/index.pck']
          path=pathlib.Path('/tmp/v138-forward-depot-capture');path.mkdir()
          (path/'index.pck').write_bytes(pck)
          (path/'capture.gd').write_bytes(pathlib.Path('ci/capture-v138-forward-depot.gd').read_bytes())
          (path/'input.json').write_text(json.dumps({'source_commit':source,'game_tree':tree,'build':row['build'],'pck_sha256':hashlib.sha256(pck).hexdigest()}))
          PY
      - name: Play exact native game through real menu taps and supply victory
        run: python3 -B ci/capture-v138-forward-depot-guard.py /tmp/v138-forward-depot-capture vc-ce2efc75244b 390 844 candidate
      - name: Verify actual mission combat and destination-specific win, renderer and PNG hashes
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/v138-forward-depot-capture')
          d=json.loads((p/'images/report.json').read_text())
          run=json.loads((p/'native-render-receipt.json').read_text())
          info=json.loads((p/'input.json').read_text())
          assert d['failed']==0 and len(d['checks'])==18 and all(x['passed'] for x in d['checks'])
          assert d['build']=='vc-ce2efc75244b'==info['build'] and d['accounting'] and d['won']
          assert run['returncode']==0 and run['live_process_group_gone'] and run['stop_reason'] is None
          assert run['inputs']['index.pck']==info['pck_sha256'] and run['after']['oom']==run['baseline']['oom']
          assert 2900<=d['ticks']<=4200 and d['mission']['deliveries']>=20 and d['depot']['food']>=80000 and d['depot']['wood']>=120000
          assert d['home']['food']>0 and d['explicit_attacks']>=1 and len(d['visible_hostile_damage'])>=1
          assert d['reason']=='forward_depot_complete' and d['actual_end_ui']=='前線補給線建立'
          assert set(d['images'])=={'briefing','live-supply-run','victory'}
          for name,item in d['images'].items():
              data=(p/'images'/(name+'.png')).read_bytes()
              assert (item['width'],item['height'])==(390,844)
              assert data.startswith(bytes.fromhex('89504e470d0a1a0a')) and hashlib.sha256(data).hexdigest()==item['sha256']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v138-forward-depot-native-390
          path: |
            /tmp/v138-forward-depot-capture/input.json
            /tmp/v138-forward-depot-capture/images/*.png
            /tmp/v138-forward-depot-capture/images/report.json
            /tmp/v138-forward-depot-capture/native-render-*.json
            /tmp/v138-forward-depot-capture/native-render-*.txt
          retention-days: 30
          if-no-files-found: error
