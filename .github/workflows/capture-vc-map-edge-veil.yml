name: Capture Valley Crown map-edge veil diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/capture-vc-map-edge-veil.yml]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 88935d2b95ccf6a7159339e60e26eeff1784c64f
          path: reviewed-edge-baseline
          persist-credentials: false
      - name: Prepare pinned Godot and software display
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o "$RUNNER_TEMP/vc-map-edge-engine.zip"
          unzip -q "$RUNNER_TEMP/vc-map-edge-engine.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64"
      - name: Compare native map edges in two disposable source copies
        run: |
          bash ci/map-edge-veil/run-map-edge-capture.sh \
            "$GITHUB_WORKSPACE/reviewed-edge-baseline" \
            "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64" \
            "$RUNNER_TEMP/vc-map-edge-veil"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vc-e6b4b7b5efdf-native-map-edge-veil-diagnostic
          path: ${{ runner.temp }}/vc-map-edge-veil/
          retention-days: 30
          if-no-files-found: ignore
