name: Capture exact Double Crossing Valley overview and actual crossings
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-v139-exact-river.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {w: 390, h: 844}
          - {w: 844, h: 390}
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Bind official engine, exact artifact bytes and reviewed capture tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '2b24cf607e926c3316208fc199d9ff4cde8202c691037975bc5fa548d6e33205  ci/capture-v139-exact-river.gd' | sha256sum --strict -c
          echo '61cb64f9dfaa1a6aee1ca288435b1eb8b6349e3ae2a2d52b00c9a67962a05355  ci/capture-v139-exact-river-guard.py' | sha256sum --strict -c
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/v137-engine.zip
          unzip -q /tmp/v137-engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --strict -c
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path[:0]=['scripts']
          from web_release_archive import GitHub,verified_members
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          row,workflow_head,source,tree=({'artifact_id': 14588880894, 'run_id': 44642506940, 'build': 'vc-b93dd669a7ce', 'metadata_sha256': '34dceae9253a5c1f23b7faf20cdd41f0fed8965eb692cf262569274bba8f3b6b', 'zip_sha256': 'a1db24e208013e8718533ddeafc1648236e371f1a8574ab56e2976ce33aa0426'}, '9f432fb7869fcea28925e2411decf6f37788136d', 'e2beeda5af306e3e18ba7983e72c2c524815ffb2', '10cd03224304d312693302b7417ba02e08763462')
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']==workflow_head
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          files=verified_members(g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True),row)
          m=json.loads(files['candidate-metadata.json'])
          assert m['source_commit']==source and m['game_tree']==tree
          pck=files['artifacts/clean-a/index.pck']
          assert pck==files['artifacts/clean-b/index.pck']
          path=pathlib.Path('/tmp/v139-exact-river');path.mkdir()
          (path/'index.pck').write_bytes(pck)
          (path/'capture.gd').write_bytes(pathlib.Path('ci/capture-v139-exact-river.gd').read_bytes())
          (path/'input.json').write_text(json.dumps({'source_commit':source,'game_tree':tree,'build':row['build'],'pck_sha256':hashlib.sha256(pck).hexdigest()}))
          PY

      - name: Render the exact approved package during real touch crossings
        env:
          WIDTH: ${{ matrix.w }}
          HEIGHT: ${{ matrix.h }}
        run: python3 -B ci/capture-v139-exact-river-guard.py /tmp/v139-exact-river vc-b93dd669a7ce "$WIDTH" "$HEIGHT" candidate
      - name: Verify actual route/ledger/PNG glyph and exact product identity
        env:
          WIDTH: ${{ matrix.w }}
          HEIGHT: ${{ matrix.h }}
        run: |
          python3 -B - <<'PY'
          import os,json,pathlib,hashlib
          r=pathlib.Path("/tmp/v139-exact-river")
          j=json.loads((r/"images/report.json").read_text())
          info=json.loads((r/"input.json").read_text())
          gr=json.loads((r/"native-render-receipt.json").read_text())
          assert j['size']==[int(os.environ['WIDTH']),int(os.environ['HEIGHT'])] and j['layout']=='river_crossings' and j['build']==info['build']=='vc-b93dd669a7ce'
          assert j['failed']==0 and len(j['checks'])==25 and all(x['passed'] for x in j['checks'])
          assert all(j['paths'][k]['cross_ticks']>0 and not j['paths'][k]['wet_steps'] for k in ['bridge-crossing','ford-crossing'])
          assert gr['returncode']==0 and gr['stop_reason'] is None and gr['live_process_group_gone']
          assert gr['inputs']['index.pck']==info['pck_sha256'] and gr['after']['oom']==gr['baseline']['oom']
          assert set(j['images'])=={'layout-overview','bridge-crossing','ford-crossing'}
          for key,v in j['images'].items():
              data=(r/"images"/(key+'.png')).read_bytes()
              assert data[:8]==bytes.fromhex("89504e470d0a1a0a") and hashlib.sha256(data).hexdigest()==v['sha256'] and v['size']==j['size']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v139-exact-river-native-${{ matrix.w }}x${{ matrix.h }}
          path: |
            /tmp/v139-exact-river/input.json
            /tmp/v139-exact-river/native-render-*
            /tmp/v139-exact-river/images/*.png
            /tmp/v139-exact-river/images/report.json
          retention-days: 30
          if-no-files-found: error
