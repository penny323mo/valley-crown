name: Validate current Web release in Chrome
on:
  push:
    branches: [ci/public-web-browser-vc-dd795d96905c]
permissions:
  contents: read
  actions: read
concurrency:
  group: public-web-browser-vc-dd795d96905c
  cancel-in-progress: false
jobs:
  browser:
    name: Browser smoke (${{ matrix.profile }})
    if: ${{ github.run_attempt == 1 }}
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, portrait]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Select fresh work root
        run: echo "RTS_WORK=$RUNNER_TEMP/current-web-qa-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.profile }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test exact observed Node preflight without launching a browser
        run: python3 -B -m unittest discover -s qa -p test_node_preflight.py -v
      - name: Test bounded profile fixture without launching a browser
        run: node --test qa/test_profile_fixture.mjs
      - name: Retrieve exact successful export artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13830390118'
          run-id: '42962521219'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
          merge-multiple: true
      - name: Prepare verified Web bytes, pinned npm packages and stock Chrome metadata
        run: python3 -B qa/prepare_browser_qa.py --candidate candidate --work "$RTS_WORK" --profile "${{ matrix.profile }}"
      - name: Test selected profile in owned bounded Chrome service
        run: python3 -B qa/run_host_browser.py --lock "$RTS_WORK/browser-lock.json" --export "$RTS_WORK/export" --bundle "$GITHUB_WORKSPACE/qa" --deps "$RTS_WORK/deps" --output "$RTS_WORK/evidence" --receipt "$RTS_WORK/host-guard.json"
      - name: Verify exact owned service cleanup independently
        if: always()
        run: |
          if [ -f "$RTS_WORK/host-guard.json" ]; then
            python3 -B qa/run_host_browser.py --cleanup "$RTS_WORK/host-guard.json"
          fi
      - name: Retain factual browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-web-browser-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.RTS_WORK }}/evidence/*.png
            ${{ env.RTS_WORK }}/evidence/*.json
            ${{ env.RTS_WORK }}/evidence/*.log
            ${{ env.RTS_WORK }}/host-guard.json
            ${{ env.RTS_WORK }}/browser-lock.json
            ${{ env.RTS_WORK }}/preparation.json
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
# No deployment, privileged browser, custom seccomp, sysctl changes or sandbox bypass.
