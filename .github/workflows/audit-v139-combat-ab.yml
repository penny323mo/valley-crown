name: Compare real v138 battle feedback with normally aged effects
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-v139-combat-ab.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        role: [baseline, prototype]
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Bind official engine, exact artifact bytes and reviewed capture tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '71aa25d021458a9a94fc2aefa86e43ee2cc6818d4d1b55dd7dd4cd5b7c772dcd  ci/audit-v139-combat-ab.gd' | sha256sum --strict -c
          echo 'ce909adc5560302cb3dc84aed9d4c892251253b5aa31871758a4f50f3d4c00f5  ci/audit-v139-combat-ab-guard.py' | sha256sum --strict -c
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/v137-engine.zip
          unzip -q /tmp/v137-engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --strict -c
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path[:0]=['scripts']
          from web_release_archive import GitHub,verified_members
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          row,workflow_head,source,tree=({'artifact_id': 14580174918, 'run_id': 44626413569, 'build': 'vc-ce2efc75244b', 'metadata_sha256': '3dd5ebf42f693b612b3843f8ef9c4eed43b4722d3d03d843080f12f80fa406b9', 'zip_sha256': '7cd2eec672926e643d8885f4903fb6f050cfd450db55dd4e7990bd84ed693397'}, 'e9e51f952bc156f43f1880ee12da53428f1f4b68', '521dfb8b65191c8b4a0c8452272bdc46bdeaa06a', 'a16eb9691c6a592fa41e720ea149f71377257c0b')
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']==workflow_head
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          files=verified_members(g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True),row)
          m=json.loads(files['candidate-metadata.json'])
          assert m['source_commit']==source and m['game_tree']==tree
          pck=files['artifacts/clean-a/index.pck']
          assert pck==files['artifacts/clean-b/index.pck']
          path=pathlib.Path('/tmp/v139-combat-ab');path.mkdir()
          (path/'index.pck').write_bytes(pck)
          overlay=pathlib.Path('ci/audit-v139-combat-variant.gd').read_bytes()
          assert hashlib.sha256(overlay).hexdigest()=='a56e68cb6f1428b6c7abe5cc96152094ffc6262e93ee73ff7be9b17eb227bca5'
          (path/'combat-variant.gd').write_bytes(overlay)
          (path/'capture.gd').write_bytes(pathlib.Path('ci/audit-v139-combat-ab.gd').read_bytes())
          (path/'input.json').write_text(json.dumps({'source_commit':source,'game_tree':tree,'build':row['build'],'pck_sha256':hashlib.sha256(pck).hexdigest()}))
          PY

      - name: Play same real game and record equivalent simulation at fixed ticks
        env:
          ROLE: ${{ matrix.role }}
        run: python3 -B ci/audit-v139-combat-ab-guard.py /tmp/v139-combat-ab vc-ce2efc75244b 390 844 "$ROLE"
      - name: Validate real battle, exact project and untouched authoritative timeline
        env:
          ROLE: ${{ matrix.role }}
        run: |
          python3 -B - <<'PY'
          import json,hashlib,pathlib,os
          p=pathlib.Path('/tmp/v139-combat-ab')
          d=json.loads((p/'images/report.json').read_text())
          r=json.loads((p/'native-render-receipt.json').read_text())
          i=json.loads((p/'input.json').read_text())
          assert all(x['passed'] for x in d['checks']) and d['role']==os.environ['ROLE']
          assert d['build']=='vc-ce2efc75244b'==i['build'] and d['ledger'] and d['start_tick']==5 and d['attacks']>0 and d['hostile_damage']
          assert d['signature']=='582dd12d563d900c820ba3d8a9b9be1f3cc5a5cf4f58de2da75cd24e2093129e'
          assert d['peak']==(6 if d['role']=='baseline' else 5)
          assert r['returncode']==0 and r['live_process_group_gone'] and r['stop_reason'] is None and r['inputs']['index.pck']==i['pck_sha256'] and r['after']['oom']==r['baseline']['oom']
          assert set(d['images'])=={'combat-220','combat-280'}
          for name,m in d['images'].items():
              b=(p/'images'/(name+'.png')).read_bytes()
              assert (m['width'],m['height'])==(390,844) and b[:8]==bytes.fromhex('89504e470d0a1a0a') and hashlib.sha256(b).hexdigest()==m['sha256']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v139-combat-readability-${{ matrix.role }}
          path: |
            /tmp/v139-combat-ab/input.json
            /tmp/v139-combat-ab/images/*.png
            /tmp/v139-combat-ab/images/report.json
            /tmp/v139-combat-ab/native-render-*.json
            /tmp/v139-combat-ab/native-render-*.txt
          retention-days: 30
          if-no-files-found: error
