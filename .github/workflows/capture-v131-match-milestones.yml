name: Capture genuine v131 victory milestones
on:
  push:
    branches: [main]
    paths: [.github/workflows/capture-v131-match-milestones.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: github.repository == 'penny323mo/valley-crown' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official distribution display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Bind official engine, exact artifact bytes and reviewed capture tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '9150e89c80a6cd6b49715f85a82074a1bd2d03dfef24cc710152bbd2eb9b530a  ci/capture-v131-match-milestones.gd' | sha256sum --strict -c
          echo '980e5f0186966c2e57b896f8abc72c73014d500c9e4b0e3a016fab94807eda85  ci/capture-v131-match-milestones-guard.py' | sha256sum --strict -c
          curl -fL --max-time 180 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/v131-engine.zip
          unzip -q /tmp/v131-engine.zip -d /tmp
          echo 'f64d4ed19fc9df9440321653fcc80df8c6e365ba7b6de0a29e2cfa9fa71bfeb3  /tmp/Godot_v4.6.3-stable_linux.x86_64' | sha256sum --strict -c
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path[:0]=['scripts']
          from web_release_archive import GitHub,verified_members
          g=GitHub(os.environ['GITHUB_REPOSITORY'])
          row,workflow_head,source,tree=({'artifact_id': 14544716567, 'run_id': 44550546351, 'build': 'vc-466cb41c0518', 'metadata_sha256': 'b519c4dcb53b8490748affce9c4501255b3d9be3edca572fbe5f455225f4091e', 'zip_sha256': '9ce0031585c85568076da2ecec0c83d897be320d7ec1c56dde958b81a11cf434'}, '89e037d0a413a8201d664afc90273f9afa37db8e', '147347a68e52d72bf03f49256646aee3b4289730', 'd0a5e0df8a548abb6c8b0f8d1f7931f96f1bf896')
          run=g.request('/actions/runs/'+str(row['run_id']))
          assert run['conclusion']=='success' and run['head_sha']==workflow_head
          a=g.request('/actions/artifacts/'+str(row['artifact_id']))
          assert not a['expired'] and a['workflow_run']['id']==row['run_id']
          files=verified_members(g.request('/actions/artifacts/'+str(row['artifact_id'])+'/zip',binary=True),row)
          m=json.loads(files['candidate-metadata.json'])
          assert m['source_commit']==source and m['game_tree']==tree
          pck=files['artifacts/clean-a/index.pck']
          assert pck==files['artifacts/clean-b/index.pck']
          path=pathlib.Path('/tmp/v131-capture');path.mkdir()
          (path/'index.pck').write_bytes(pck)
          (path/'capture.gd').write_bytes(pathlib.Path('ci/capture-v131-match-milestones.gd').read_bytes())
          (path/'input.json').write_text(json.dumps({'source_commit':source,'game_tree':tree,'build':row['build'],'pck_sha256':hashlib.sha256(pck).hexdigest()}))
          PY
      - name: Run bounded ordinary siege victory report capture
        run: python3 -B ci/capture-v131-match-milestones-guard.py /tmp/v131-capture vc-466cb41c0518
      - name: Verify authentic victory report PNG
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/v131-capture')
          d=json.loads((p/'images/report.json').read_text())
          run=json.loads((p/'native-render-receipt.json').read_text())
          info=json.loads((p/'input.json').read_text())
          assert d['complete'] and len(d['checks'])==11 and all(x['passed'] for x in d['checks'])
          assert d['build']=='vc-466cb41c0518'==info['build']
          assert run['returncode']==0 and run['process_group_gone'] and run['stop_reason'] is None
          assert run['inputs']['index.pck']==info['pck_sha256'] and run['after']['oom']==run['baseline']['oom']
          assert d['outcome']=='victory' and d['stage']==2 and d['reason']=='breach_complete' and d['tick']==4590
          assert {x['action']:x['tick'] for x in d['facts'] if x['action']!='lost'}=={'contact':369,'trained':2620,'completed':2713}
          assert d['png'] and d['width']==390 and d['height']==844
          data=(p/'images'/'victory-milestones.png').read_bytes()
          assert data.startswith(bytes.fromhex('89504e470d0a1a0a')) and hashlib.sha256(data).hexdigest()==d['sha256']
          assert data[12:16]==b'IHDR' and int.from_bytes(data[16:20],'big')==390 and int.from_bytes(data[20:24],'big')==844
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v131-match-milestones-real-native
          path: |
            /tmp/v131-capture/input.json
            /tmp/v131-capture/images/*.png
            /tmp/v131-capture/images/report.json
            /tmp/v131-capture/native-render-*.json
            /tmp/v131-capture/native-render-*.txt
          retention-days: 30
          if-no-files-found: error
