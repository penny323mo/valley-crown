name: Capture one genuine full rendered diagnostic match
on:
  push:
    branches: [ci/rendered-match-browser-vc-79ebcaef19e3]
permissions:
  contents: read
  actions: read
concurrency:
  group: rendered-match-diagnostic-vc-79ebcaef19e3
  cancel-in-progress: false
jobs:
  rendered:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rendered390
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Select unique short work root
        working-directory: ${{ github.workspace }}
        run: echo "RTS_WORK=$RUNNER_TEMP/r-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inert profile, guard, dependency and source binding checks
        run: |
          python3 -B -m unittest discover -s qa -p test_rendered_profile_preflight.py -v
          python3 -B -m unittest discover -s qa -p test_node_preflight.py -v
          python3 -B -m unittest discover -s qa -p test_socket_preflight.py -v
          python3 -B -m unittest discover -s qa -p test_export_pins_preflight.py -v
          python3 -B -m unittest discover -s qa -p test_construction_binding.py -v
          node --test qa/test_capture_handshake.mjs qa/test_rendered_fixture.mjs qa/test_public_observation_assertions.mjs qa/test_passive_diagnostics.mjs qa/test_public_stream_cache_policy.mjs
      - name: Require exact independently reviewed diagnostic export pins
        id: pins
        run: python3 -B qa/check_export_pins.py --expected qa/expected-export.json --scenario qa/scenario-manifest.json --github-output "$GITHUB_OUTPUT"
      - name: Retrieve exact diagnostic export only on fresh hosted runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.pins.outputs.artifact_id }}
          run-id: ${{ steps.pins.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: rendered390/candidate
          merge-multiple: true
      - name: Prepare exact diagnostic bytes and stock Chrome with all original admission gates
        run: |
          python3 -B qa/prepare_browser_qa.py --candidate candidate --work "$RTS_WORK" --profile portrait
          python3 -B qa/validate_construction_binding.py --scenario qa/scenario-manifest.json --lock "$RTS_WORK/browser-lock.json"
      - name: One distinct reviewed475-second owned browser profile
        run: python3 -B qa/run_host_rendered.py --lock "$RTS_WORK/browser-lock.json" --export "$RTS_WORK/export" --bundle "$GITHUB_WORKSPACE/rendered390/qa" --deps "$RTS_WORK/deps" --output "$RTS_WORK/evidence" --receipt "$RTS_WORK/host-guard.json"
      - name: Independently validate original thirteen natural match obligations
        run: python3 -B qa/validate_rendered_match.py "$RTS_WORK/evidence/full-match-report.json"
      - name: Verify exact owned cleanup independently
        if: always()
        run: |
          if [ -f "$RTS_WORK/host-guard.json" ]; then
            python3 -B qa/run_host_rendered.py --cleanup "$RTS_WORK/host-guard.json"
          fi
      - name: Retain factual evidence including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rendered-match-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.RTS_WORK }}/evidence/*.png
            ${{ env.RTS_WORK }}/evidence/*.json
            ${{ env.RTS_WORK }}/evidence/*.log
            ${{ env.RTS_WORK }}/host-guard.json
            ${{ env.RTS_WORK }}/browser-lock.json
            ${{ env.RTS_WORK }}/preparation.json
          if-no-files-found: warn
          retention-days: 14
